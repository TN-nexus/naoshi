<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>てみーのホーム</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../dads/global.css">
<link rel="stylesheet" href="../dads/components.css">
<style>
/* てみーのホーム（apps/dash/schema.md §7・§9）。娘が見る。
   数字の圧力を作らない: ○×の数・順位・比較・お祝い・リザルト画面は出さない。済は記録の証拠だけ（自己申告なし）。
   強調は焦点だけ（済の行・有効なだけの行を光らせない）。タップ 44px 以上、本文 17px 以上、最小 14px。 */
:root{
  --ink: var(--color-neutral-solid-gray-800);
  --sub: var(--color-neutral-solid-gray-600);
  --line: var(--color-neutral-solid-gray-200);
  --bg: var(--color-neutral-solid-gray-50);
  --s-算: var(--color-primitive-blue-600);
  --s-国: var(--color-primitive-magenta-600);
  --s-理: var(--color-primitive-green-600);
  --s-社: var(--color-primitive-orange-600);
  --s-計: var(--color-neutral-solid-gray-600);
  --s-漢: var(--color-primitive-purple-600);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:calc(17/16*1rem);line-height:1.7;-webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:calc(22/16*1rem);line-height:1.5;margin:0}
h2{font-size:calc(18/16*1rem);line-height:1.5;margin:0 0 8px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.head .day{color:var(--sub)}
.small{font-size:calc(14/16*1rem);color:var(--sub);line-height:1.5}
/* タブ（自前。DADS の tab は vendoring していないので menu-list の色に寄せる） */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{flex:1;min-height:48px;border:0;background:transparent;font:inherit;font-weight:700;color:var(--sub);border-bottom:4px solid transparent;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px}
/* きょう */
.plan{list-style:none;margin:0;padding:0}
.plan li{display:grid;grid-template-columns:28px 1fr;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);min-height:44px}
.plan li:first-child{border-top:0}
.plan .st{font-size:calc(22/16*1rem);line-height:1.3;text-align:center}
.plan .tx{line-height:1.5}
.plan .meta{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:calc(14/16*1rem);color:var(--sub)}
.plan .wd{white-space:nowrap}
.plan li.fixed{color:var(--sub)}
.tag{display:inline-block;border:1px solid var(--color-neutral-solid-gray-420);border-radius:4px;padding:0 6px;font-size:calc(14/16*1rem);line-height:1.6;color:var(--sub);white-space:nowrap}
/* きょうの進み */
.prog{display:flex;align-items:center;gap:12px}
.prog .bar{flex:1;height:12px;border-radius:6px;background:var(--color-neutral-solid-gray-100);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--color-neutral-solid-gray-600);border-radius:6px}
.prog .n{white-space:nowrap}
/* つづき */
.todo{list-style:none;margin:0;padding:0}
.todo li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);min-height:56px}
.todo li:first-child{border-top:0}
.todo .t{flex:1;min-width:0;line-height:1.5}
.todo .t .small{display:block}
.todo .dads-button{flex:none;font-size:calc(17/16*1rem)}
/* きろく: 7日のドット */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.week .col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.week .lb{font-size:calc(14/16*1rem);color:var(--sub);line-height:1.3}
.week .lb b{display:block;color:var(--ink);font-weight:400;font-size:calc(16/16*1rem)}
.week .col.today .lb b{font-weight:700}
.dot{width:44px;height:44px;max-width:100%;border:0;padding:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font:inherit}
.dot span{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;color:#fff;font-size:calc(14/16*1rem);font-weight:700;line-height:1}
.dot[aria-pressed="true"] span{width:auto;min-width:30px;padding:0 6px;border-radius:15px}
.rec{margin:0;padding:0;list-style:none}
.rec>li{padding:8px 0;border-top:1px solid var(--line)}
.rec>li:first-child{border-top:0}
.rec .d{font-weight:700}
.rec ul{list-style:none;margin:4px 0 0;padding:0}
.rec ul li{display:flex;align-items:center;gap:8px;line-height:1.5;padding:2px 0}
.chip{flex:none;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:#fff;font-size:calc(14/16*1rem);font-weight:700}
.rec .n{margin-left:auto;color:var(--sub);font-size:calc(14/16*1rem);white-space:nowrap}
/* せいせき */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:calc(16/16*1rem);line-height:1.3}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-weight:700;color:var(--sub);font-size:calc(14/16*1rem)}
.foot{text-align:center;margin-top:24px}
.err{padding:40px 0;text-align:center}
</style>
</head>
<body>
<main id="app" class="dads-u-std-17N-170"><p class="small">よみこみ中…</p></main>
<script>
// データ: ?d=<デプロイID>&h=<HOME_KEY> → POST {app:'dash', op:'home', args:{h}}（schema §1・§2）
// ローカル（preview.py）で d が無いときは /home.json を読む。
const params = new URLSearchParams(location.search);
const DEPLOY = params.get("d") || "";
const HKEY = params.get("h") || "";
const API = DEPLOY ? `https://script.google.com/macros/s/${encodeURIComponent(DEPLOY)}/exec` : "";
const LOCAL = !DEPLOY && /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const SUBJ = ["算", "国", "理", "社", "計", "漢"];
const SUBJ_FULL = { "算数": "算", "国語": "国", "理科": "理", "社会": "社" };
const sc = s => `var(--s-${SUBJ.includes(s) ? s : "計"})`;
const md = iso => { const m = /^\d{4}-(\d{2})-(\d{2})/.exec(iso || ""); return m ? `${+m[1]}/${+m[2]}` : ""; };
let D = null, TAB = "kyou";

async function load() {
  if (LOCAL) { const r = await fetch("/home.json", { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return r.json(); }
  if (!API) throw new Error("no d");
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, credentials: "omit",
                               body: JSON.stringify({ app: "dash", op: "home", args: { h: HKEY } }) });
  if (!r.ok) throw new Error(r.status);
  const j = await r.json();
  if (!j || j.error || !Array.isArray(j.today_plan)) throw new Error((j && j.error) || "bad");
  return j;
}

function fail() { $app.innerHTML = `<p class="err">きろくを読めなかった</p>`; }

function stGlyph(done) { return done === "済" ? "☑" : done === "途中" ? "◐" : "☐"; }
function stLabel(done) { return done === "済" ? "すんだ" : done === "途中" ? "とちゅう" : "まだ"; }

function planHtml() {
  const rows = D.today_plan || [];
  if (!rows.length) return `<p class="small">きょうの予定はない</p>`;
  return `<ul class="plan">${rows.map(r => {
    const fixed = r.mark === "固定";
    const meta = [r.time ? `<span>${esc(r.time)}</span>` : (r.slot ? `<span>${esc(r.slot)}</span>` : ""),
                  !fixed && r.mark ? `<span class="tag">${esc(r.mark)}</span>` : "",
                  r.word ? `<span class="wd">→ ${esc(r.word)}</span>` : ""].filter(Boolean).join("");
    return `<li class="${fixed ? "fixed" : ""}"><span class="st" role="img" aria-label="${stLabel(r.done)}">${fixed ? "" : stGlyph(r.done)}</span>`
         + `<span class="tx">${esc(r.text)}</span>${meta ? `<span class="meta">${meta}</span>` : ""}</li>`;
  }).join("")}</ul>`;
}

function progHtml() {
  const p = D.progress || { done: 0, total: 0 };
  const pct = p.total ? Math.round(100 * p.done / p.total) : 0;
  return `<div class="prog"><div class="bar" role="img" aria-label="済 ${p.done}／全 ${p.total}"><i style="width:${pct}%"></i></div>`
       + `<span class="n">済 ${esc(p.done)}／全 ${esc(p.total)}</span></div>`;
}

function todoHtml() {
  const t = D.todo || {};
  const row = (title, sub, url) => `<li><span class="t">${esc(title)}${sub ? `<span class="small">${sub}</span>` : ""}</span>`
    + (url ? `<a class="dads-button" data-type="outline" data-size="md" href="${esc(url)}">ひらく</a>` : "") + `</li>`;
  const rows = [];
  for (const n of t.naoshi || []) rows.push(row(`直し ${n.title}`, `${n.date ? esc(n.date) + "・" : ""}のこり ${esc(n.left)}`, n.url));
  for (const e of t.te || []) rows.push(row(e.label, `のこり ${esc(e.left)}`, e.url));
  if (D.links && D.links.nendai) rows.push(row("ねんだい", "", D.links.nendai));
  const more = +t.more > 0 ? `<p class="small" style="margin:8px 0 0">ほかに ${+t.more} 件</p>` : "";   // 一覧から切った直し
  return (rows.length ? `<ul class="todo">${rows.join("")}</ul>` : `<p class="small">つづきはない</p>`) + more;
}

function weekHtml() {
  const w = D.week || [];
  return `<div class="week">${w.map((d, i) => {
    const dots = SUBJ.filter(s => (d.by || {})[s] > 0).map(s =>
      `<button class="dot" type="button" aria-pressed="false" data-n="${esc(d.by[s])}" data-s="${s}" aria-label="${md(d.date)} ${s}"><span style="background:${sc(s)}">${s}</span></button>`).join("");
    return `<div class="col${d.date === D.today ? " today" : ""}"><span class="lb"><b>${esc(d.wd)}</b>${md(d.date)}</span>${dots}</div>`;
  }).join("")}</div>`;
}

function recHtml() {
  const r = D.record || [];
  if (!r.length) return `<p class="small">きろくはまだない</p>`;
  return `<ul class="rec">${r.map(d => `<li><span class="d">${md(d.date)}</span><ul>${(d.rows || []).map(x =>
    `<li><span class="chip" style="background:${sc(x.subject)}">${esc(x.subject)}</span><span>${esc(x.label)}</span><span class="n">${esc(x.n)}問</span></li>`).join("")}</ul></li>`).join("")}</ul>`;
}

function scoreHtml() {
  const tests = ((D.scores || {}).tests) || [];
  if (!tests.length) return `<p class="small">まだない</p>`;
  const subs = ["算数", "国語", "理科", "社会"];
  return `<div class="card"><h2>偏差値</h2><div class="tbl"><table><thead><tr><th>テスト</th>${subs.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody>`
    + tests.map(t => `<tr><td>${esc(t.name)}<br><span class="small">${md(t.date)}</span></td>${subs.map(s => `<td>${esc(((t.by || {})[s] || {}).dev ?? "")}</td>`).join("")}</tr>`).join("")
    + `</tbody></table></div></div>`
    + `<div class="card"><h2>得点</h2><div class="tbl"><table><thead><tr><th>テスト</th>${subs.map(s => `<th>${s}</th>`).join("")}</tr></thead><tbody>`
    + tests.map(t => `<tr><td>${esc(t.name)}</td>${subs.map(s => `<td>${esc(((t.by || {})[s] || {}).score ?? "")}</td>`).join("")}</tr>`).join("")
    + `</tbody></table></div></div>`;
}

function render() {
  const tabs = [["kyou", "きょう"], ["kiroku", "きろく"]];
  if (D.show_scores) tabs.push(["seiseki", "せいせき"]);
  if (!tabs.some(t => t[0] === TAB)) TAB = "kyou";
  const upd = /T(\d{2}:\d{2})/.exec(D.updated || "");
  let body = "";
  if (TAB === "kyou") {
    body = `<section class="card"><h2>きょう</h2>${planHtml()}</section>`
         + `<section class="card"><h2>つづき</h2>${todoHtml()}</section>`
         + `<section class="card"><h2>きょうの進み</h2>${progHtml()}</section>`;
  } else if (TAB === "kiroku") {
    body = `<section class="card"><h2>この7日</h2>${weekHtml()}</section>`
         + `<section class="card"><h2>やったこと</h2>${recHtml()}</section>`;
  } else {
    body = scoreHtml();
  }
  $app.innerHTML = `<div class="head"><h1>てみーのホーム</h1><span class="day">${md(D.today)}（${esc(D.wd)}）</span></div>`
    + `<div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button type="button" role="tab" data-tab="${k}" aria-selected="${k === TAB}">${l}</button>`).join("")}</div>`
    + body
    + (upd ? `<p class="foot small">更新 ${upd[1]}</p>` : "");
}

$app.addEventListener("click", e => {
  const t = e.target.closest("[data-tab]");
  if (t) { TAB = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const d = e.target.closest(".dot");
  if (d) {   // 押したときだけ数を出す（もう一度押すと戻る）
    const on = d.getAttribute("aria-pressed") !== "true";
    d.setAttribute("aria-pressed", on);
    d.firstElementChild.textContent = on ? `${d.dataset.s}${d.dataset.n}` : d.dataset.s;
  }
});

load().then(j => { D = j; render(); }).catch(fail);
</script>
</body>
</html>
