<!-- 図と問題（DOM に触らない。apps/sim/test_5B08.js が答えを解答 CSV と照合する） -->
<script id="data">
const D = Math.PI/180;
const add = (p, q, k = 1) => [p[0]+q[0]*k, p[1]+q[1]*k];
const sub = (p, q) => [p[0]-q[0], p[1]-q[1]];
const mul = (p, k) => [p[0]*k, p[1]*k];
const lerp = (p, q, t) => [p[0]+(q[0]-p[0])*t, p[1]+(q[1]-p[1])*t];
const dist = (p, q) => Math.hypot(p[0]-q[0], p[1]-q[1]);
const unit = p => mul(p, 1/Math.hypot(p[0], p[1]));
const rot = (p, a) => [p[0]*Math.cos(a) - p[1]*Math.sin(a), p[0]*Math.sin(a) + p[1]*Math.cos(a)];
const polar = (r, deg) => [r*Math.cos(deg*D), r*Math.sin(deg*D)];
const div = (P, Q, m, n) => lerp(P, Q, m/(m+n));          // PQ を m:n に分ける点
function meet(P1, P2, Q1, Q2) {                            // 直線 P1P2 と Q1Q2 の交点
  const d1 = sub(P2, P1), d2 = sub(Q2, Q1), den = d1[0]*d2[1] - d1[1]*d2[0];
  return add(P1, d1, ((Q1[0]-P1[0])*d2[1] - (Q1[1]-P1[1])*d2[0])/den);
}
// 三角形ABCの中の点O（△OBC:△OCA:△OAB = a:b:c）
const bary = (A, B, C, a, b, c) => [(a*A[0]+b*B[0]+c*C[0])/(a+b+c), (a*A[1]+b*B[1]+c*C[1])/(a+b+c)];
function shoelace(pts) {
  let s = 0;
  pts.forEach((p, i) => { const q = pts[(i+1) % pts.length]; s += p[0]*q[1] - q[0]*p[1]; });
  return Math.abs(s)/2;
}

// 数の書き方: 整数／小数（割り切れるとき）／帯分数
function frac(x, maxD = 1000) {
  for (let d = 1; d <= maxD; d++) { const n = Math.round(x*d); if (Math.abs(n/d - x) < 1e-7*Math.max(1, Math.abs(x))) return [n, d]; }
  return null;
}
function fmtNum(x) {
  const f = frac(x);
  if (!f) return String(Math.round(x*100)/100);
  const [n, d] = f;
  if (d === 1) return String(n);
  if (100 % d === 0) return String(+(n/d).toFixed(2));
  const w = Math.floor(n/d), r = n - w*d;
  return (w ? w + 'と' : '') + r + '/' + d;
}
function ratio(x, y) { const f = frac(x/y); return f || [Math.round(x/y*100)/100, 1]; }
const fmtR = (x, y) => ratio(x, y).join(':');
const sumA = (g, list) => list.reduce((t, s) => t + g.A(s), 0);

// 図の上の計算（面積は unit で実際の値にそろえる）
function ctxOf(F) {
  const pts = s => [...s].map(c => F.P[c]);
  const A = s => shoelace(pts(s))*F.K, L = s => dist(F.P[s[0]], F.P[s[1]])*Math.sqrt(F.K);
  return {A, L, a:s => fmtNum(A(s)), l:s => fmtNum(L(s)), ra:(s, t) => fmtR(A(s), A(t)), rl:(s, t) => fmtR(L(s), L(t)),
    n:fmtNum, r:fmtR,
    par:(s, t) => { const u = unit(sub(F.P[s[1]], F.P[s[0]])), v = unit(sub(F.P[t[1]], F.P[t[0]])); return Math.abs(u[0]*v[1] - u[1]*v[0]); }};
}
function makeFig(f) {
  const F = {P:f.P, lines:f.lines.split(' '), marks:f.marks || [], labels:f.labels || [], hide:f.hide || '', K:1};
  if (f.unit) F.K = f.unit[1]/shoelace([...f.unit[0]].map(c => f.P[c]));
  return F;
}

// ───── 説明の手順の型 ─────
// 点Yが辺XZの上、直線 V-O-Y（V は向かいの頂点）→ XY:YZ = △XVO:△ZVO（ひき算）
function sideSteps(g, X, Y, Z, V, O) {
  return [
    {k:'hl', polys:[[X+V+Y, 0], [Z+V+Y, 1]], cap:`頂点${V}から見ると △${X}${V}${Y} と △${Z}${V}${Y} は高さが同じ → 面積の比 ＝ ${X}${Y}:${Y}${Z}`},
    {k:'hl', polys:[[X+O+Y, 0], [Z+O+Y, 1]], cap:`点${O}から見ても高さが同じ → △${X}${O}${Y}:△${Z}${O}${Y} も ${X}${Y}:${Y}${Z}`},
    {k:'hl', polys:[[X+V+O, 0], [Z+V+O, 1]], cap:`大きい方から小さい方をひいても同じ比 → ${X}${Y}:${Y}${Z} ＝ △${X}${V}${O}:△${Z}${V}${O} ＝ ${g.a(X+V+O)}:${g.a(Z+V+O)} ＝ ${g.ra(X+V+O, Z+V+O)}`},
  ];
}
const oneSide = (g, X, Y, Z, V, O) => ({k:'hl', polys:[[X+V+O, 0], [Z+V+O, 1]],
  cap:`${X}${Y}:${Y}${Z} ＝ △${X}${V}${O}:△${Z}${V}${O}（${Y}の向かいの2つ）＝ ${g.a(X+V+O)}:${g.a(Z+V+O)} ＝ ${g.ra(X+V+O, Z+V+O)}`});
// 直線 X-O-Y、両側の頂点 U・W → XO:OY = (△UXO+△WXO):(△UYO+△WYO)（たし算）
function kiteSteps(g, X, O, Y, U, W) {
  const a = g.A(U+X+O) + g.A(W+X+O), b = g.A(U+Y+O) + g.A(W+Y+O);
  return [
    {k:'hl', polys:[[U+X+O, 0], [U+Y+O, 1]], cap:`頂点${U}から見ると △${U}${X}${O} と △${U}${Y}${O} は高さが同じ → 面積の比 ＝ ${X}${O}:${O}${Y}`},
    {k:'hl', polys:[[W+X+O, 0], [W+Y+O, 1]], cap:`頂点${W}から見ても同じ → △${W}${X}${O}:△${W}${Y}${O} も ${X}${O}:${O}${Y}`},
    {k:'hl', polys:[[U+X+O, 0], [W+X+O, 0], [U+Y+O, 1], [W+Y+O, 1]],
      cap:`たしても同じ比 → ${X}${O}:${O}${Y} ＝ (${g.a(U+X+O)}＋${g.a(W+X+O)}):(${g.a(U+Y+O)}＋${g.a(W+Y+O)}) ＝ ${fmtNum(a)}:${fmtNum(b)} ＝ ${fmtR(a, b)}`},
  ];
}
function oneKite(g, X, O, Y, U, W) {
  const a = g.A(U+X+O) + g.A(W+X+O), b = g.A(U+Y+O) + g.A(W+Y+O);
  return {k:'hl', polys:[[U+X+O, 0], [W+X+O, 0], [U+Y+O, 1], [W+Y+O, 1]],
    cap:`${X}${O}:${O}${Y} ＝ （${X}側の2つ）:（${Y}側の2つ）＝ (${g.a(U+X+O)}＋${g.a(W+X+O)}):(${g.a(U+Y+O)}＋${g.a(W+Y+O)}) ＝ ${fmtR(a, b)}`};
}

// ───── 問題（mat・no は記録の教材名と問題番号。exp は算数_正解_5B08.csv の答え） ─────
const TABS = {};

TABS.sim = {title:'相似（ピラミッド・砂時計）', presets:[
  {mat:'確認テスト', no:'1(1)(2)', text:'辺DEと辺BCは平行。AD＝5cm、DB＝2cm、DE＝4cm。',
    fig() {
      const B = [0, 0], A = polar(7, 70), D = div(A, B, 5, 2), E = add(D, [4, 0]), C = meet(A, E, B, [1, 0]);
      return {P:{A, B, C, D, E}, lines:'ABC DE', marks:[['A', 'D', '5cm'], ['D', 'B', '2cm'], ['D', 'E', '4cm']]};
    },
    given:g => [[g.L('AD'), 5], [g.L('DB'), 2], [g.L('DE'), 4], [g.par('DE', 'BC'), 0]],
    qs:[{text:'辺BCの長さ', t:'num', unit:'cm', v:g => g.L('BC'), exp:'5.6'},
        {text:'三角形ADE：台形DBCE', t:'ratio', v:g => [g.A('ADE'), g.A('DBCE')], exp:'25:24'}],
    steps:g => [
      {k:'hl', polys:[['ADE', 0], ['ABC', 1]], cap:'平行な線 DE で切ると、上の小さい三角形と全体の三角形が同じ形（ピラミッド）'},
      {k:'morph', from:'ADE', to:'ABC', cap:`対応するのは AD と AB（DB ではない）→ AD:AB ＝ 5:7 → DE:BC ＝ 5:7 → BC ＝ 4×7/5 ＝ ${g.l('BC')}cm`},
      {k:'tile', a:['ADE', 5], b:['ABC', 7], cap:`面積は同じ大きさの三角形の数で比べる → 5×5 ＝ 25 個 : 7×7 ＝ 49 個 → 台形は 49−25 ＝ 24 → ${g.ra('ADE', 'DBCE')}`},
    ]},
  {mat:'予シリ', no:'基本1(1)②', text:'ABとCDは平行。AB＝28cm、BD＝20cm、CD＝12cm。□（DO）の長さは？',
    fig() {
      const B = [0, 0], A = polar(28, 48), D = [20, 0], C = add(D, unit(sub(A, B)), 12), O = meet(A, C, B, D);
      return {P:{A, B, C, D, O}, lines:'AB BO AO CD', marks:[['A', 'B', '28cm'], ['B', 'D', '20cm'], ['C', 'D', '12cm'], ['D', 'O', '□']]};
    },
    given:g => [[g.L('AB'), 28], [g.L('BD'), 20], [g.L('CD'), 12], [g.par('AB', 'CD'), 0]],
    qs:[{text:'□（DO）の長さ', t:'num', unit:'cm', v:g => g.L('DO'), exp:'15'}],
    steps:g => [
      {k:'hl', polys:[['OCD', 0], ['OAB', 1]], cap:'頂点Oの小さい三角形 OCD と大きい三角形 OAB が同じ形（ピラミッド）'},
      {k:'morph', from:'OCD', to:'OAB', cap:`CD:AB ＝ 12:28 ＝ 3:7 → OD:OB も 3:7 → DB は 7−3 ＝ ④ ＝ 20cm → ① ＝ 5cm → OD ＝ ③ ＝ ${g.l('DO')}cm`},
    ]},
  {mat:'演問', no:'反復基本1(3)', text:'長方形ABCD。AB＝11cm、AE＝10cm、ED＝2cm。①EF:FB　②三角形AFEの面積',
    fig() {
      const A = [0, 11], B = [0, 0], C = [12, 0], D = [12, 11], E = [10, 11], F = meet(A, C, B, E);
      return {P:{A, B, C, D, E, F}, lines:'ABCD AC BE', marks:[['A', 'B', '11cm'], ['A', 'E', '10cm'], ['E', 'D', '2cm']]};
    },
    given:g => [[g.L('AB'), 11], [g.L('AE'), 10], [g.L('ED'), 2]],
    qs:[{text:'EF:FB', t:'ratio', v:g => [g.L('EF'), g.L('FB')], exp:'5:6'},
        {text:'三角形AFEの面積', t:'num', unit:'cm²', v:g => g.A('AFE'), exp:'25'}],
    steps:g => [
      {k:'hl', polys:[['FAE', 0], ['FCB', 1]], cap:'AE と BC が平行 → 砂時計の形（△FAE と △FCB が同じ形）'},
      {k:'morph', from:'FAE', to:'FCB', cap:`AE:CB ＝ 10:12 ＝ 5:6 → EF:FB ＝ ${g.rl('EF', 'FB')}`},
      {k:'hl', polys:[['ABE', 1]], cap:`△ABE ＝ 10×11÷2 ＝ ${g.a('ABE')}cm²（÷2 を忘れない）`},
      {k:'hl', polys:[['AFE', 0], ['AFB', 1]], cap:`頂点Aから見ると高さが同じ → △AFE は △ABE の 5/11 → ${g.a('ABE')}×5/11 ＝ ${g.a('AFE')}cm²`},
    ]},
  {mat:'予シリ', no:'基本1(3)', text:'長方形ABCD。AB＝12cm、BE＝8cm、EC＝12cm。①DF:FE　②三角形FECの面積',
    fig() {
      const A = [0, 12], B = [0, 0], C = [20, 0], D = [20, 12], E = [8, 0], F = meet(A, C, D, E);
      return {P:{A, B, C, D, E, F}, lines:'ABCD AC DE', marks:[['A', 'B', '12cm'], ['B', 'E', '8cm'], ['E', 'C', '12cm']]};
    },
    given:g => [[g.L('AB'), 12], [g.L('BE'), 8], [g.L('EC'), 12]],
    qs:[{text:'DF:FE', t:'ratio', v:g => [g.L('DF'), g.L('FE')], exp:'5:3'},
        {text:'三角形FECの面積', t:'num', unit:'cm²', v:g => g.A('FEC'), exp:'27'}],
    steps:g => [
      {k:'hl', polys:[['FDA', 0], ['FEC', 1]], cap:'AD と EC が平行 → 砂時計（△FDA と △FEC が同じ形）'},
      {k:'morph', from:'FDA', to:'FEC', cap:`AD:EC ＝ 20:12 ＝ 5:3 → DF:FE ＝ ${g.rl('DF', 'FE')}`},
      {k:'hl', polys:[['DEC', 1]], cap:`△DEC ＝ 12×12÷2 ＝ ${g.a('DEC')}cm²`},
      {k:'hl', polys:[['FEC', 0], ['FDC', 1]], cap:`頂点Cから見ると高さが同じ → △FEC は △DEC の 3/8 → ${g.a('DEC')}×3/8 ＝ ${g.a('FEC')}cm²`},
    ]},
  {mat:'演問', no:'反復練習1', text:'台形ABCD（角B・角Cは直角）。AB＝12cm、BC＝20cm、DC＝16cm、EはDCの真ん中。(1)AF:FC　(2)四角形AFEDの面積',
    fig() {
      const A = [0, 12], B = [0, 0], C = [20, 0], D = [20, 16], E = div(D, C, 1, 1), F = meet(A, C, B, E);
      return {P:{A, B, C, D, E, F}, lines:'ABCD AC BE', marks:[['A', 'B', '12cm'], ['B', 'C', '20cm'], ['D', 'C', '16cm']]};
    },
    given:g => [[g.L('AB'), 12], [g.L('BC'), 20], [g.L('DC'), 16], [g.L('DE'), 8]],
    qs:[{text:'AF:FC', t:'ratio', v:g => [g.L('AF'), g.L('FC')], exp:'3:2'},
        {text:'四角形AFEDの面積', t:'num', unit:'cm²', v:g => g.A('AFED'), exp:'128'}],
    steps:g => [
      {k:'hl', polys:[['FAB', 0], ['FCE', 1]], cap:'AB と CE が平行（どちらも BC に直角）→ 砂時計'},
      {k:'morph', from:'FAB', to:'FCE', cap:`AB:CE ＝ 12:8 ＝ 3:2 → AF:FC ＝ ${g.rl('AF', 'FC')}、BF:FE も 3:2`},
      {k:'hl', polys:[['BCE', 1], ['FCE', 0]], cap:`△BCE ＝ 8×20÷2 ＝ ${g.a('BCE')} → △FCE はその 2/5 ＝ ${g.a('FCE')}cm²`},
      {k:'hl', polys:[['ACD', 0], ['FCE', 1]], cap:`四角形AFED ＝ △ACD − △FCE ＝ ${g.a('ACD')} − ${g.a('FCE')} ＝ ${g.a('AFED')}cm²`},
    ]},
], free:{
  cfg:{type:'pyr', a:5, b:2},
  specs:[{type:'select', id:'type', label:'形', options:[['pyr', 'ピラミッド'], ['hour', '砂時計']]},
         {type:'range', id:'a', label:'a', min:1, max:8, step:1}, {type:'range', id:'b', label:'b', min:1, max:8, step:1}],
  make(c) {
    const {a, b} = c;
    if (c.type === 'pyr') return {text:`AD:DB ＝ ${a}:${b}、DE と BC は平行`,
      fig:() => { const B = [0, 0], C = [10, 0], A = [3.5, 8.5], D = div(A, B, a, b), E = div(A, C, a, b);
        return {P:{A, B, C, D, E}, lines:'ABC DE', marks:[['A', 'D', `${a}`], ['D', 'B', `${b}`]]}; },
      steps:g => [
        {k:'morph', from:'ADE', to:'ABC', cap:`対応するのは AD と AB → 相似比 ${a}:${a+b}（DB の ${b} ではない）→ DE:BC も ${fmtR(a, a+b)}`},
        {k:'tile', a:['ADE', a], b:['ABC', a+b], cap:`面積は ${a}×${a} ＝ ${a*a} 個 : ${a+b}×${a+b} ＝ ${(a+b)**2} 個（台形は ${(a+b)**2 - a*a}）`},
      ]};
    return {text:`AB と CD は平行、AO:OD ＝ ${a}:${b}`,
      fig:() => { const O = [0, 0], A = mul([-1.2, 0.9], a), B = mul([-0.6, -0.9], a), D = mul([1.2, -0.9], b), C = mul([0.6, 0.9], b);
        return {P:{A, B, C, D, O}, lines:'AB CD AD BC', marks:[['A', 'O', `${a}`], ['O', 'D', `${b}`]]}; },
      steps:g => [
        {k:'morph', from:'OAB', to:'ODC', cap:`ひっくり返すと重なる → 相似比 AO:DO ＝ ${a}:${b} → AB:DC も ${fmtR(a, b)}`},
        {k:'tile', a:['OAB', a], b:['ODC', b], cap:`面積は ${a*a} 個 : ${b*b} 個 → ${fmtR(a*a, b*b)}`},
      ]};
  }}};

TABS.area = {title:'面積の比（2乗か、そのままか）', presets:[
  {mat:'演問', no:'反復基本1(2)①', text:'アとイの面積の比は？（LP＝21cm、PT＝28cm）',
    fig() {

<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const COL = ['#1a5fd0', '#d07a20'], FILL = ['rgba(26,95,208,.28)', 'rgba(208,122,32,.32)'];
const TOP = 74;   // 上の説明文の場所

// 画面への写し（y は上向き）
const V = {sc:30, ox:0, oy:0};
const X = x => V.ox + x*V.sc, Y = y => V.oy - y*V.sc;
function fit(pts) {
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys), m = 40, H = cv.height - TOP;
  V.sc = Math.min((cv.width - 2*m)/(x1 - x0 || 1), (H - 2*m)/(y1 - y0 || 1));
  V.ox = (cv.width - (x1 - x0)*V.sc)/2 - x0*V.sc;
  V.oy = TOP + H - (H - (y1 - y0)*V.sc)/2 + y0*V.sc;
}
function poly(pts, fill, stroke, w = 1, dash) {
  ctx.beginPath();
  pts.forEach((p, i) => i ? ctx.lineTo(X(p[0]), Y(p[1])) : ctx.moveTo(X(p[0]), Y(p[1])));
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = w; ctx.setLineDash(dash || []); ctx.stroke(); ctx.setLineDash([]); }
}
function seg(p, q, col, w = 1.5, dash) {
  ctx.beginPath(); ctx.moveTo(X(p[0]), Y(p[1])); ctx.lineTo(X(q[0]), Y(q[1]));
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.setLineDash(dash || []); ctx.stroke(); ctx.setLineDash([]);
}
function text(t, sx, sy, col = '#222', size = 15, al = 'center') {
  ctx.fillStyle = col; ctx.font = size + 'px sans-serif'; ctx.textAlign = al; ctx.textBaseline = 'middle'; ctx.fillText(t, sx, sy);
}
function caption(t) {
  ctx.font = '15px sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'top'; ctx.fillStyle = '#222';
  let line = '', y = 8;
  for (const ch of t) {
    if (ctx.measureText(line + ch).width > cv.width - 20) { ctx.fillText(line, 10, y); line = ''; y += 21; }
    line += ch;
  }
  ctx.fillText(line, 10, y);
}
const ease = t => Math.min(1, t*1.4);

// 小さな三角形のしきつめ（n×n 個。上向き→下向きの順に返す）
function tiles(P, Q, R, n) {
  const G = (i, j) => add(add(P, sub(Q, P), i/n), sub(R, P), j/n), out = [];
  for (let k = 0; k < n; k++)
    for (let i = 0; i <= k; i++) {
      const j = k - i;
      out.push([G(i, j), G(i+1, j), G(i, j+1)]);
      if (i + j <= n - 2) out.push([G(i+1, j), G(i, j+1), G(i+1, j+1)]);
    }
  return out;
}

let tab = TABS.sim, tabKey = 'sim', cur, F, g, steps = [], s = 0, dir = 0, mode = 'pred', revealed = false, pIdx = 0, shown = false;

function load(item) {
  cur = item; F = makeFig(item.fig()); g = ctxOf(F); steps = item.steps(g);
  fit(Object.values(F.P));
}
function visible(name) {
  if (!F.hide.includes(name)) return true;
  if (!(mode === 'free' || revealed)) return false;
  const i = steps.findIndex(st => st.k === 'ext' && st.show.includes(name));
  return i >= 0 && s >= i + 0.6;
}
function drawStep(st, t) {
  const P = F.P, pts = s2 => [...s2].map(c => P[c]);
  if (st.k === 'hl') for (const [pl, c] of st.polys) poly(pts(pl), FILL[c].replace(/[\d.]+\)$/, m => (parseFloat(m)*t) + ')'), COL[c], 2);
  if (st.k === 'morph') {
    const A = pts(st.from), B = pts(st.to);
    poly(A, FILL[0]); poly(B, null, COL[1], 2, [5, 4]);
    poly(A.map((p, i) => lerp(p, B[i], t)), 'rgba(26,95,208,.15)', COL[0], 3);
  }
  if (st.k === 'tile') {
    // 大きい方を先に、小さい方は不透明で上に重ねる（ピラミッドで重なっても色が混ざらない）。数は重ならないところに出す
    const inA = q => { const [a, b, c] = pts(st.a[0]), sg = (p, u, v) => (p[0]-v[0])*(u[1]-v[1]) - (u[0]-v[0])*(p[1]-v[1]);
      const d1 = sg(q, a, b), d2 = sg(q, b, c), d3 = sg(q, c, a); return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0)); };
    [[st.b, 1, 'rgba(208,122,32,.32)'], [st.a, 0, '#c6d6f2']].forEach(([[tri, n], c, fill]) => {
      const T = tiles(...pts(tri), n), k = Math.round(T.length*t);
      T.forEach((tr, i) => poly(tr, i < k ? fill : null, '#999', 0.6));
      const cs = T.map(tr => tr.reduce((a, p) => add(a, p, 1/3), [0, 0])), out = c === 1 ? cs.filter(q => !inA(q)) : cs;
      const at = (out.length ? out : cs).reduce((a, p, _, l) => add(a, p, 1/l.length), [0, 0]);
      if (k) text(`${out.length < cs.length ? '全体で ' : ''}${k}個`, X(at[0]), Y(at[1]), COL[c], 16);
    });
  }
  if (st.k === 'fan') {
    const A = P[st.apex], B0 = P[st.from], B1 = P[st.to], k = Math.round(st.n*t);
    for (let i = 0; i < st.n; i++) {
      const u = lerp(B0, B1, i/st.n), v = lerp(B0, B1, (i+1)/st.n);
      poly([A, u, v], i < k ? FILL[i < st.split ? 0 : 1] : null, '#999', 0.8);
    }
  }
}
function draw() {
  const done = mode === 'free' || revealed, P = F.P;
  ctx.clearRect(0, 0, cv.width, cv.height);
  const N = steps.length, ci = Math.min(Math.floor(s), N - 1), t = ease(s - ci);
  const pts = s2 => [...s2].map(c => P[c]);
  // 補助線（のばした線）は出たあともずっと見せる
  if (done) steps.forEach((st, i) => {
    if (st.k !== 'ext' || s <= i) return;
    const tt = i < ci ? 1 : t;
    for (const [a, b] of st.segs) seg(P[a], lerp(P[a], P[b], tt), '#2a9d4a', 2, [6, 4]);
  });
  // いまの手順（keep のついた手順は、そのあとも残す＝見比べ用）
  const st = done && N ? steps[ci] : null;
  if (st) { steps.slice(0, ci).forEach(x => x.keep && drawStep(x, 1)); drawStep(st, t); }
  // 図の線
  for (const tok of F.lines) {
    const ps = [...tok];
    if (ps.some(c => !visible(c))) continue;
    if (ps.length === 2) seg(P[ps[0]], P[ps[1]], '#222');
    else poly(pts(tok), null, '#222', 1.5);
  }
  // 点の名前・長さ・ア イ
  const names = Object.keys(P).filter(visible), cen = names.reduce((a, c) => add(a, P[c], 1/names.length), [0, 0]);
  for (const c of names) {
    const d = sub(P[c], cen), l = Math.hypot(d[0], d[1]) || 1;
    text(c, X(P[c][0]) + d[0]/l*14, Y(P[c][1]) - d[1]/l*14, '#222', 15);
  }
  for (const [a, b, tx] of F.marks) {
    const m = lerp(P[a], P[b], 0.5), dd = unit(sub(P[b], P[a])), nrm = [dd[1], -dd[0]];
    const side = (m[0]-cen[0])*nrm[0] + (m[1]-cen[1])*nrm[1] >= 0 ? 1 : -1;
    text(tx, X(m[0]) + nrm[0]*side*16, Y(m[1]) - nrm[1]*side*16, '#555', 13);
  }
  for (const [tx, pl] of F.labels) {
    const c = pts(pl).reduce((a, p) => add(a, p, 1/pl.length), [0, 0]);
    text(tx, X(c[0]), Y(c[1]), '#222', 16);
  }
  if (st) caption(`${ci + 1}/${N}　${st.cap}`);
  else caption(mode === 'pred' ? '予想を入れて「答えを決めて動かす」' : '');
  $('bd').innerHTML = done ? steps.slice(0, ci + 1).map((x, i) => `<div class="${i === ci ? 'cur' : ''}">${i + 1}. ${x.cap}</div>`).join('') : '予想を入れると動かせる';
  $('scrub').value = N ? s/N : 0;
}
function setControls() {
  const on = mode === 'free' || revealed;
  ['bStart', 'bRev', 'bPause', 'bPlay', 'bEnd', 'scrub'].forEach(id => $(id).disabled = !on);
}

// 予想モード
function parseNum(v) {
  v = v.replace(/[０-９．／]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).trim();
  let m;
  if ((m = v.match(/^(\d+)(?:と|\s+)(\d+)\/(\d+)$/))) return +m[1] + m[2]/m[3];
  if ((m = v.match(/^(\d+)\/(\d+)$/))) return m[1]/m[2];
  if (/^\d+(\.\d+)?$/.test(v)) return +v;
  return null;
}
function getAns(q, i) {
  if (q.t === 'ratio') { const a = $(`q${i}a`).value, b = $(`q${i}b`).value; return a === '' || b === '' || +a <= 0 || +b <= 0 ? null : [+a, +b]; }
  return parseNum($(`q${i}`).value);
}
function checkFilled() { $('go').disabled = revealed || cur.qs.some((q, i) => getAns(q, i) === null); }
function renderPred() {
  $('qText').innerHTML = `<div class="small">${cur.mat} ${cur.no}</div>${cur.text}`;
  $('qs').innerHTML = cur.qs.map((q, i) => `<div class="q"><b>${i+1}.</b> ${q.text} ` +
    (q.t === 'ratio' ? `<input id="q${i}a" type="number" min="1"> : <input id="q${i}b" type="number" min="1">`
                     : `<input id="q${i}" type="text"> ${q.unit}`) + '</div>').join('');
  $('qs').querySelectorAll('input').forEach(e => e.oninput = checkFilled);
  $('result').innerHTML = ''; checkFilled();
}
function loadPreset(i) {
  pIdx = i; s = 0; dir = 0; revealed = false; shown = false;
  load(tab.presets[i]); renderPred(); setControls(); draw();
}
function showResult() {
  shown = true;
  const rows = cur.qs.map((q, i) => {
    const p = getAns(q, i), a = q.v(g);
    if (q.t === 'ratio') {
      const [x, y] = ratio(a[0], a[1]);
      return {q:q.text, pred:p.join(':'), act:`${x}:${y}`, ok:Math.abs(p[0]/p[1] - a[0]/a[1]) < 1e-6*a[0]/a[1]};
    }
    return {q:q.text, pred:fmtNum(p) + q.unit, act:fmtNum(a) + q.unit, ok:Math.abs(p - a) < 1e-6*Math.max(1, a)};
  });
  $('result').innerHTML = '<table><tr><th></th><th>予想</th><th>実際</th><th></th></tr>' +
    rows.map((r, i) => `<tr><td>${i+1}</td><td>${r.pred}</td><td>${r.act}</td><td>${r.ok ? '<span class="ok">○</span>' : '<span class="ng">×</span>'}</td></tr>`).join('') +
    '</table><div style="margin-top:4px">ずれたところは ◀ で戻して見直そう</div>';
  logPush(rows);
}
$('go').onclick = () => {
  revealed = true; $('go').disabled = true;
  $('qs').querySelectorAll('input').forEach(e => e.disabled = true);
  setControls(); s = 0; dir = 1;
};
$('next').onclick = () => loadPreset((pIdx + 1) % tab.presets.length);

// フリーモード
let fcfg = {};
function loadFree() { load(tab.free.make(fcfg[tabKey])); s = Math.min(s, steps.length); draw(); }
function renderFree() {
  const c = fcfg[tabKey];
  $('fc').innerHTML = tab.free.specs.map(sp => sp.type === 'select'
    ? `<label>${sp.label} <select id="f_${sp.id}">${sp.options.map(([v, l]) => `<option value="${v}" ${c[sp.id] == v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>`
    : `<label>${sp.label} <span class="mono">${c[sp.id]}</span><input id="f_${sp.id}" type="range" min="${sp.min}" max="${sp.max}" step="${sp.step}" value="${c[sp.id]}"></label>`).join('') +
    `<div class="small" id="ftext"></div>`;
  for (const sp of tab.free.specs) {
    const el = $('f_' + sp.id);
    el.oninput = () => {
      c[sp.id] = sp.type === 'range' ? +el.value : el.value;
      if (sp.type === 'range') el.previousElementSibling.textContent = c[sp.id];
      loadFree(); $('ftext').textContent = cur.text;
    };
  }
  $('ftext').textContent = cur.text;
}
function toFree() {
  mode = 'free'; dir = 0;
  $('tFree').classList.add('on'); $('tPred').classList.remove('on'); $('pred').hidden = true; $('free').hidden = false;
  fcfg[tabKey] = fcfg[tabKey] || {...tab.free.cfg};
  s = 0; loadFree(); renderFree(); setControls(); s = steps.length; draw();
}
function toPred() {
  mode = 'pred';
  $('tPred').classList.add('on'); $('tFree').classList.remove('on'); $('pred').hidden = false; $('free').hidden = true;
  loadPreset(pIdx);
}
$('tFree').onclick = toFree;
$('tPred').onclick = toPred;
function selectTab(key, i = 0) {
  document.querySelectorAll('[data-sim]').forEach(x => x.classList.toggle('on', x.dataset.sim === key));
  tab = TABS[key]; tabKey = key; pIdx = i; s = 0; dir = 0;
  if (mode === 'pred') loadPreset(i); else toFree();
}
document.querySelectorAll('[data-sim]').forEach(b => b.onclick = () => selectTab(b.dataset.sim));

// 教材の問題へのショートカット（予想モードで開く）
for (const key in TABS) TABS[key].presets.forEach((p, i) => {
  const b = document.createElement('button');
  b.textContent = `${p.mat === '確認テスト' ? '確認' : p.mat} ${p.no}`;
  b.onclick = () => { if (mode === 'free') toPred(); selectTab(key, i); };
  $('cuts').appendChild(b);
});

// 再生
$('bStart').onclick = () => { dir = 0; s = 0; draw(); };
$('bEnd').onclick = () => { dir = 0; s = steps.length; draw(); };
$('bPlay').onclick = () => { if (s >= steps.length) s = 0; dir = 1; };
$('bRev').onclick = () => { if (s <= 0) s = steps.length; dir = -1; };
$('bPause').onclick = () => { dir = 0; };
$('scrub').oninput = e => { dir = 0; s = +e.target.value * steps.length; draw(); };

let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last)/1000); last = now;
  if (dir) {
    s += dir * +$('spd').value * 0.4 * dt;
    if (s >= steps.length) { s = steps.length; dir = 0; if (mode === 'pred' && revealed && !shown && !VIEW) showResult(); }
    if (s <= 0) { s = 0; dir = 0; }
    draw();
  }
  requestAnimationFrame(tick);
}

// 記録（予想モードの答え。書き出した CSV を apps/sim/ingest.py が wiki/logs/シミュ詳細.csv へ取り込む）
const LOGKEY = 'sim_5B08_log';
const logGet = () => JSON.parse(localStorage.getItem(LOGKEY) || '[]');
function logN() { $('logn').textContent = `たまっている記録 ${logGet().length} 件`; }
function logPush(rows) {
  const L = logGet(), now = new Date(), ts = new Date(now - now.getTimezoneOffset()*60000).toISOString().slice(0, 19);
  for (const r of rows) L.push([ts, '5B08', tab.title, cur.mat, cur.no, cur.text, r.q, r.pred, r.act, r.ok ? '○' : '×']);
  localStorage.setItem(LOGKEY, JSON.stringify(L)); logN();
}
$('exp').onclick = () => {
  const q = v => '"' + String(v).replace(/"/g, '""') + '"';
  const csv = '﻿' + [['日時', '単元', 'シミュレーター', '教材', '問題番号', '問題', '設問', '予想', '実際', '正誤'], ...logGet()].map(r => r.map(q).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = `シミュ5B08_記録_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
};

logN();
loadPreset(0);
// 見る専用: 予想入力なし。どの問題も ▶ を押すだけ。?q= があればその問題から始める
const VIEW = true;
document.body.id = 'viewonly';
{
  const _lp = loadPreset;
  loadPreset = function(i) { _lp(i); revealed = true; shown = true; setControls(); draw(); };
  const q = new URLSearchParams(location.search).get('q');
  if (q) {
  for (const key in TABS) { const i = TABS[key].presets.findIndex(p => p.mat + '|' + p.no === q); if (i >= 0) { selectTab(key, i); break; } }
  }
  const mark = () => { const bs = [...$('cuts').querySelectorAll('button')]; let n = 0; for (const key in TABS) { TABS[key].presets.forEach((p, k) => { bs[n++].classList.toggle('cur', key === tabKey && k === pIdx); }); } };
  $('cuts').addEventListener('click', () => setTimeout(mark, 0));
  loadPreset(pIdx); mark();
}
requestAnimationFrame(tick);
</script>
</body></html>
