<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ねんだい</title>
<link rel="icon" href="data:,">
<style>
/* 手の器（apps/te/page.html）と同じ色・字。スマホ縦を先に作る。色は少なく、○×は大きな記号だけ */
:root{
  --bg:#f6f5f1; --card:#fff; --ink:#1f2328; --sub:#6b6f76; --line:#d9d6cf;
  --ok:#1f7a4d; --ng:#b3261e; --sel:#2b5cb8; --selbg:#e6eefc;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;font-size:18px;line-height:1.7;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:12px 14px 40px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:2px 2px 8px;border-bottom:1px solid var(--line);margin-bottom:12px;min-height:40px}
.bar h1{font-size:18px;margin:0;flex:1}
.bar .cnt{font-size:15px;color:var(--sub);white-space:nowrap}
.back{border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 10px;font-size:15px}
#norec{position:fixed;top:1px;right:6px;font-size:10px;line-height:1.2;color:var(--sub);z-index:50}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.small{font-size:14px;color:var(--sub)}
/* 時代の札 */
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:10px;background:#fff;padding:4px;min-height:64px;overflow:hidden}
.tile img{display:block;width:100%;height:56px;object-fit:cover;border-radius:6px}
.tile .nm{font-size:17px;font-weight:700;line-height:1.3}
.tile .nm.l{font-size:14px;letter-spacing:-.04em;white-space:nowrap}
.tile .kn{font-size:10px;color:var(--sub);line-height:1.2;white-space:nowrap;letter-spacing:-.04em}
.tile:disabled{color:inherit;opacity:1;cursor:default}
.tile.sel{border-color:var(--sel);background:var(--selbg)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
/* ホーム */
.era{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:start}
.era .tile{min-height:84px}
.bd{padding:4px 0 6px;border-top:1px solid var(--line)}
.bd:first-child{border-top:0}
.bd .bn{font-size:15px;font-weight:700}
.modes{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.m{border:1.5px solid var(--ink);background:#fff;border-radius:8px;padding:3px 9px;font-size:14px;line-height:1.5}
.m.done{background:var(--ink);color:#fff}
.m:disabled{border-color:#e2dfd8;color:#c9c6bf;background:transparent;cursor:default}
.m.nr{margin-top:6px}
/* 1問 */
.ev{font-size:22px;font-weight:700;line-height:1.45}
.evk{font-size:13px;color:var(--sub);margin-top:2px}
.hint{font-size:14px;color:var(--sub);margin-top:4px}
.chosen{display:flex;align-items:center;gap:10px;margin:6px 0}
.disp{flex:1;font-size:34px;font-weight:800;letter-spacing:.18em;text-align:center;border-bottom:2px solid var(--ink);min-height:1.5em;line-height:1.4;font-variant-numeric:tabular-nums}
.disp .ph{color:#d4d1ca}
.ce{font-size:18px;font-weight:700;min-width:5em}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.pad button{font-size:26px;font-weight:700;padding:10px 0;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.pad button.w{font-size:17px}
.pad button.go{background:var(--ink);color:#fff;border-color:var(--ink)}
.pad button:disabled{opacity:.3;cursor:default}
.mark{font-size:120px;font-weight:800;text-align:center;line-height:1.1;margin:4px 0}
.mark.ok{color:var(--ok)} .mark.ng{color:var(--ng)}
.ansbox{display:flex;gap:12px;align-items:center}
.ansbox .tile{width:110px;min-height:96px;flex:none}
.ansbox .tile img{height:80px}
.ay{font-size:34px;font-weight:800;line-height:1.2}
.goro{font-size:19px;margin-top:4px}
.nogoro{color:#666;font-size:15px;font-weight:400}
.goro b{font-weight:900;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.gk{font-size:13px;color:var(--sub)}
.next{display:block;width:100%;margin-top:12px;font-size:19px;font-weight:700;padding:13px;border-radius:10px;border:2px solid var(--ink);background:#fff}
.lead{font-size:14px;color:var(--sub);margin:6px 0 2px}
/* 大きく出す（資料集のページ丸ごとを想定） */
.ov{position:fixed;inset:0;background:rgba(246,245,241,.98);z-index:40;display:flex;flex-direction:column;padding:10px 12px 14px}
.ov .big{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}
.ov .big img{max-width:100%;max-height:100%;object-fit:contain}
.ov .big .nm{font-size:64px;font-weight:800;line-height:1.2;text-align:center}
.ov .big .kn{font-size:22px;color:var(--sub);text-align:center}
.ov .btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ov .btns button{font-size:20px;font-weight:700;padding:14px 0;border-radius:10px;border:2px solid var(--ink);background:#fff}
.ov .btns .yes{background:var(--ink);color:#fff}
/* おぼえる */
.ob{display:grid;grid-template-columns:4.2em 1fr;gap:4px 10px;padding:8px 0;border-top:1px solid var(--line)}
.ob:first-of-type{border-top:0}
.ob .y{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.ob .y.hid{color:transparent;background:#e9e6df;border-radius:6px;cursor:pointer}
.ob .e{font-size:16px;font-weight:700;line-height:1.45}
.ob .g{grid-column:2;font-size:16px;margin-top:0}
.tg{border:1.5px solid var(--ink);background:#fff;border-radius:8px;padding:4px 12px;font-size:15px}
.tg.on{background:var(--ink);color:#fff}
/* ならべる */
.nr .c{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;margin:6px 0;font-size:17px;line-height:1.45}
.nr .c.on{border-color:var(--sel);background:var(--selbg)}
.nr .c .no{flex:none;width:1.7em;height:1.7em;line-height:1.7em;border-radius:50%;text-align:center;font-size:15px;font-weight:800;background:#eee;color:transparent}
.nr .c.on .no{background:var(--sel);color:#fff}
.nr .c .yy{margin-left:auto;font-weight:800;font-size:18px;white-space:nowrap}
.row2{display:flex;gap:8px;margin-top:6px}
.row2 button{flex:1;font-size:17px;font-weight:700;padding:11px 0;border-radius:10px;border:2px solid var(--ink);background:#fff}
.row2 .go{background:var(--ink);color:#fff}
.row2 button:disabled{opacity:.3;cursor:default}
.shake{animation:sh .25s}
@keyframes sh{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}70%{transform:translateX(5px)}}
#err{position:fixed;left:0;right:0;bottom:0;background:#fff3f2;color:var(--ng);font-size:12px;white-space:pre-wrap;padding:4px 8px;z-index:60;display:none}
</style>
</head>
<body>
<div id="app"><p class="small">よみこみ中…</p></div>
<div id="err"></div>
<script>
window.onerror = (m, s, l, c) => { const e = document.getElementById("err"); e.style.display = "block"; e.textContent += `${m} (${l}:${c})\n`; };
</script>
<script src="data.js"></script>
<script>
// ねんだい（apps/nendai/README.md）。歴史の出来事 → 時代をタップ ＋ 西暦を打つ。判定はページ（正解は data.js。公開してよい中身）。
// リザルト画面・点数・連続記録は出さない。束の終わりは「つぎ」だけ。解放は装置が止める（進みは端末の localStorage）。
const N = window.NENDAI || { sheet: "", eras: [], items: [] };
const params = new URLSearchParams(location.search);
const DEPLOY = params.get("d") || "";
const API = DEPLOY ? `https://script.google.com/macros/s/${encodeURIComponent(DEPLOY)}/exec` : "";
const PKEY = "nendai.progress.v1", QKEY = "nendai.queue.v1", DKEY = "nendai.dev";
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ERA = Object.fromEntries(N.eras.map(e => [e.id, e]));
const eraIdx = id => N.eras.findIndex(e => e.id === id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const byYear = (a, b) => a.year - b.year || (a.id < b.id ? -1 : 1);

// 束と時代
const BUNDLES = [];   // {name, era, idx, items}
for (const it of N.items) {
  let b = BUNDLES.find(x => x.name === it.bundle);
  if (!b) BUNDLES.push(b = { name: it.bundle, era: it.era, idx: it.bundleIdx, items: [] });
  b.items.push(it);
}
BUNDLES.sort((a, b) => eraIdx(a.era) - eraIdx(b.era) || a.idx - b.idx);
BUNDLES.forEach(b => b.items.sort(byYear));
const eraItems = id => N.items.filter(it => it.era === id).sort(byYear);
const eraBundles = id => BUNDLES.filter(b => b.era === id);

// 端末・進み・ログのキュー（localStorage が使えなくても止めない）
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let DEV = ls.get(DKEY, "");
if (!DEV) { DEV = "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); ls.set(DKEY, DEV); }
// 進み: jb[束]=1（じゅんばん 全○）、mz[束]=0..3（まぜる 済んだ段）
let P = ls.get(PKEY, { jb: {}, mz: {} });
P.jb = P.jb || {}; P.mz = P.mz || {};
const saveP = () => ls.set(PKEY, P);
const jbDone = b => !!P.jb[b];
const mzDone = b => +P.mz[b] || 0;
const mzOpen = (b, st) => jbDone(b) && mzDone(b) >= st - 1;   // ①はじゅんばん全○、②は①、③は②
const nrOpen = era => eraBundles(era).every(b => jbDone(b.name));

function ts() {   // ISO 8601・ローカル時刻・秒まで（+09:00）
  const d = new Date(), p = n => String(n).padStart(2, "0"), o = -d.getTimezoneOffset();
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}${o >= 0 ? "+" : "-"}${p(Math.floor(Math.abs(o) / 60))}:${p(Math.abs(o) % 60)}`;
}
let flushing = false;
function log(args) {
  if (!API) return;   // d が無い＝ローカル試験。送らない
  const q = ls.get(QKEY, []);
  q.push(Object.assign({ dev: DEV, ts: ts() }, args));
  ls.set(QKEY, q);
  flush();
}
async function flush() {   // 失敗しても画面は止めない。送れなかった行はキューに残し、次の機会に再送
  if (!API || flushing) return;
  flushing = true;
  try {
    for (;;) {
      const q = ls.get(QKEY, []);
      if (!q.length) break;
      const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, credentials: "omit",
                                   body: JSON.stringify({ app: "nendai", op: "log", args: q[0] }) });
      if (!r.ok) break;
      const q2 = ls.get(QKEY, []);
      q2.shift(); ls.set(QKEY, q2);
    }
  } catch (e) { /* 次の機会に */ }
  flushing = false;
}
window.addEventListener("online", flush);
document.addEventListener("visibilitychange", () => { if (!document.hidden) flush(); });

// 札（画像が読めなければ時代名＋かな）
function tileHtml(e, cls = "", attr = "") {
  return `<button class="tile ${cls}" ${attr}><img src="${esc(e.img)}" alt="" onerror="this.remove()"><span class="nm${e.name.length > 3 ? " l" : ""}">${esc(e.name)}</span><span class="kn">${esc(e.kana)}</span></button>`;
}
const goroHtml = it => {
  const g = it.goro, k = it.goroKey, i = k ? g.indexOf(k) : -1;
  if (!g) return `<span class="nogoro">（ごろ なし。数字で おぼえる）</span>`;
  return i < 0 ? esc(g) : esc(g.slice(0, i)) + `<b>${esc(k)}</b>` + esc(g.slice(i + k.length));
};
const bar = (title, right = "", back = true) =>
  `<div class="bar">${back ? `<button class="back" data-act="home">もどる</button>` : ""}<h1>${esc(title)}</h1><span class="cnt">${right}</span></div>`;

// ───── ホーム
function home() {
  R = null; Q = null;
  const eras = N.eras.map(e => {
    const bs = eraBundles(e.id).map(b => {
      const n = b.name;
      const mz = [1, 2, 3].map(st => `<button class="m ${mzDone(n) >= st ? "done" : ""}" data-act="mazeru" data-b="${esc(n)}" data-st="${st}" ${mzOpen(n, st) ? "" : "disabled"}>まぜる${"①②③"[st - 1]}</button>`).join("");
      return `<div class="bd"><div class="bn">${esc(n)}</div><div class="modes">
        <button class="m" data-act="oboeru" data-b="${esc(n)}">おぼえる</button>
        <button class="m ${jbDone(n) ? "done" : ""}" data-act="junban" data-b="${esc(n)}">じゅんばん</button>${mz}</div></div>`;
    }).join("");
    return `<div class="card era">${tileHtml(e, "", "disabled")}<div>${bs}
      <button class="m nr" data-act="naraberu" data-era="${e.id}" ${nrOpen(e.id) ? "" : "disabled"}>ならべる</button></div></div>`;
  }).join("");
  $app.innerHTML = bar("ねんだい" + (N.sheet && N.sheet !== "全部" ? `（${N.sheet}）` : ""), "", false) + (eras || `<p class="small">データがありません</p>`);
}

// ───── おぼえる（記録しない）
function oboeru(bn) {
  const b = BUNDLES.find(x => x.name === bn);
  let hide = false; const open = new Set();
  const draw = () => {
    $app.innerHTML = bar(bn + " おぼえる") + `<div class="card"><button class="tg ${hide ? "on" : ""}" id="tg">年をかくす</button></div><div class="card">` +
      b.items.map(it => `<div class="ob"><div class="y ${hide && !open.has(it.id) ? "hid" : ""}" data-id="${it.id}">${it.year}</div>
        <div class="e">${esc(it.event)}${it.hint ? `<div class="hint">${esc(it.hint)}</div>` : ""}</div><div class="g goro">${goroHtml(it)}</div></div>`).join("") +
      `</div><button class="next" data-act="home">つぎ</button>`;
    document.getElementById("tg").onclick = () => { hide = !hide; open.clear(); draw(); };
    $app.querySelectorAll(".y.hid").forEach(el => el.onclick = () => { open.add(el.dataset.id); draw(); });
  };
  draw();
}

// ───── じゅんばん・まぜる（1問ずつ。×は最後にもう一度。そこで○ならよい）
let R = null;   // いまの回 {mode, stage, title, onClear, queue, retry, pass, i, wrong:Set, failed}
function startRun(mode, bn, st) {
  const b = BUNDLES.find(x => x.name === bn);
  let items, title, onClear;
  if (mode === "junban") { items = b.items.slice(); title = `${bn} じゅんばん`; onClear = () => { P.jb[bn] = 1; }; }
  else {
    if (st === 1) items = shuffle(b.items);
    else if (st === 2) items = shuffle(eraItems(b.era));
    else items = shuffle(N.items).slice(0, 10);
    title = `${bn} まぜる${"①②③"[st - 1]}`;
    onClear = () => { P.mz[bn] = Math.max(mzDone(bn), st); };
  }
  R = { mode, stage: mode === "mazeru" ? st : "", bundle: bn, title, onClear, queue: items, retry: [], pass: 1, i: 0, failed: false };
  question();
}
let Q = null;   // いまの1問 {it, era, digits, t0, phase:"ask"|"fix", ov}
function cur() { return R.queue[R.i]; }
function question() {
  if (R.i >= R.queue.length) {
    if (R.pass === 1 && R.retry.length) { R.queue = R.retry; R.retry = []; R.pass = 2; R.i = 0; }
    else return endRun();
  }
  Q = { it: cur(), era: null, digits: "", t0: Date.now(), phase: "ask", ov: null };
  drawQ();
}
function endRun() {
  if (!R.failed) { R.onClear(); saveP(); }
  $app.innerHTML = bar(R.title) + `<button class="next" data-act="home">つぎ</button>`;
}
function drawQ(mark) {
  const it = Q.it, n = R.queue.length;
  const fix = Q.phase === "fix";
  const head = `<div class="card"><div class="ev">${esc(it.event)}</div>${it.eventKana ? `<div class="evk">${esc(it.eventKana)}</div>` : ""}${it.hint ? `<div class="hint">${esc(it.hint)}</div>` : ""}</div>`;
  let body = "";
  if (mark === "ok") body = `<div class="mark ok">○</div>`;
  else {
    if (fix) {
      const e = ERA[it.era];
      body += `<div class="mark ng">×</div><div class="card ansbox">${tileHtml(e, "", "disabled")}<div><div class="ay">${it.year}</div>
        <div class="goro">${goroHtml(it)}</div>${it.goroKana ? `<div class="gk">${esc(it.goroKana)}</div>` : ""}</div></div>`;
    }
    const tiles = N.eras.map(e => tileHtml(e, Q.era === e.id ? "sel" : "", `data-era="${e.id}"`)).join("");
    body += `<div class="card"><div class="lead">${fix ? "もういちど" : ""}じだい</div><div class="tiles">${tiles}</div>`;
    if (Q.era) {
      const d = Q.digits, show = d ? esc(d) : `<span class="ph">____</span>`;
      const doneFix = fix && Q.fixed;
      body += `<div class="chosen"><span class="ce">${esc(ERA[Q.era].name)}</span><div class="disp">${show}</div></div>` +
        (doneFix ? `<button class="next" id="nx">つぎ</button>` :
        `<div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(k => `<button data-k="${k}" ${d.length >= 4 ? "disabled" : ""}>${k}</button>`).join("")}
          <button class="w" data-k="bs" ${d ? "" : "disabled"}>けす</button><button data-k="0" ${d.length >= 4 || !d ? "disabled" : ""}>0</button>
          <button class="w go" data-k="go" ${d ? "" : "disabled"}>けってい</button></div>`);
    }
    body += `</div>`;
  }
  $app.innerHTML = bar(R.title, `${R.i + 1}/${n}`) + head + body;
  $app.querySelectorAll("[data-era]").forEach(el => el.onclick = () => openOv(el.dataset.era));
  $app.querySelectorAll("[data-k]").forEach(el => el.onclick = () => key(el.dataset.k));
  const nx = document.getElementById("nx"); if (nx) nx.onclick = () => { R.i++; question(); };
}
function openOv(id) {
  const e = ERA[id];
  const ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = `<div class="big"><img src="${esc(e.img)}" alt="" onerror="this.outerHTML='<div><div class=nm>${esc(e.name)}</div><div class=kn>${esc(e.kana)}</div></div>'"></div>
    <div class="btns"><button class="yes">この時代</button><button class="no">えらびなおす</button></div>`;
  document.body.appendChild(ov);
  ov.querySelector(".yes").onclick = () => { ov.remove(); Q.era = id; drawQ(); };
  ov.querySelector(".no").onclick = () => ov.remove();
}
function key(k) {
  if (k === "bs") Q.digits = Q.digits.slice(0, -1);
  else if (k === "go") return judge();
  else if (Q.digits.length < 4) Q.digits += k;
  drawQ();
}
function judge() {
  const it = Q.it, y = +Q.digits;
  const eraOk = it.eraOk.includes(Q.era), yearOk = y === it.year, ok = eraOk && yearOk;
  if (Q.phase === "fix") {   // 打ち直し: 判定は出さず、合うまで待つ（ログは送る）
    log({ mode: "retype", bundle: it.bundle, year: it.year, event: it.event, aEra: ERA[Q.era].name, aYear: y, eraOk: +eraOk, yearOk: +yearOk, ok: +ok, sec: "", stage: R.stage });
    if (ok) Q.fixed = true; else { Q.digits = ""; if (!eraOk) Q.era = null; }
    return drawQ();
  }
  const sec = Math.round((Date.now() - Q.t0) / 100) / 10;
  log({ mode: R.mode, bundle: it.bundle, year: it.year, event: it.event, aEra: ERA[Q.era].name, aYear: y, eraOk: +eraOk, yearOk: +yearOk, ok: +ok, sec, stage: R.stage });
  if (ok) { drawQ("ok"); setTimeout(() => { if (Q && Q.it === it) { R.i++; question(); } }, 600); return; }
  if (R.pass === 1) R.retry.push(it); else R.failed = true;
  Q.phase = "fix"; Q.era = null; Q.digits = ""; Q.fixed = false;
  drawQ();
}

// ───── ならべる（同じ時代から4つ。足りなければ隣の時代。古い順にタップ）
const NR_ROUNDS = 5;
function pickFour(era) {
  const k = eraIdx(era), pool = shuffle(eraItems(era)), out = [], years = new Set();
  const take = list => { for (const it of list) { if (out.length >= 4) return; if (!years.has(it.year)) { out.push(it); years.add(it.year); } } };
  take(pool);
  for (let d = 1; out.length < 4 && d < N.eras.length; d++) {
    for (const j of [k - d, k + d]) if (N.eras[j]) take(shuffle(eraItems(N.eras[j].id)));
  }
  return shuffle(out);
}
function naraberu(era) {
  R = { mode: "naraberu", era, title: `${ERA[era].name} ならべる`, round: 0 };
  nrRound();
}
function nrRound() {
  if (R.round >= NR_ROUNDS) { $app.innerHTML = bar(R.title) + `<button class="next" data-act="home">つぎ</button>`; return; }
  Q = { four: pickFour(R.era), tap: [], t0: Date.now(), phase: "ask" };
  drawNr();
}
function drawNr() {
  const four = Q.four, fix = Q.phase === "fix" || Q.phase === "fixed";
  const list = fix ? four.slice().sort(byYear) : four;   // ×のあとは正しい順を年つきで
  const cards = (fix ? four : list).map(it => {
    const k = Q.tap.indexOf(it.id);
    return `<button class="c ${k >= 0 ? "on" : ""}" data-id="${it.id}"><span class="no">${k >= 0 ? k + 1 : ""}</span><span>${esc(it.event)}</span></button>`;
  }).join("");
  let html = bar(R.title, `${R.round + 1}/${NR_ROUNDS}`);
  if (Q.mark === "ok") html += `<div class="mark ok">○</div>`;
  else if (fix) {
    html += `<div class="mark ng">×</div><div class="card nr">` + list.map((it, i) =>
      `<div class="c" style="border:0;margin:0;padding:6px 0"><span class="no" style="background:var(--ink);color:#fff">${i + 1}</span><span>${esc(it.event)}</span><span class="yy">${it.year}</span></div>`).join("") + `</div>`;
    html += `<div class="lead">ふるい じゅんに タップ</div><div class="nr">${cards}</div>` +
      (Q.phase === "fixed" ? `<button class="next" id="nx">つぎ</button>` : "");
  } else {
    html += `<div class="lead">ふるい じゅんに タップ</div><div class="nr">${cards}</div>
      <div class="row2"><button id="cl" ${Q.tap.length ? "" : "disabled"}>やりなおす</button><button class="go" id="go" ${Q.tap.length === 4 ? "" : "disabled"}>けってい</button></div>`;
  }
  $app.innerHTML = html;
  $app.querySelectorAll(".nr button.c").forEach(el => el.onclick = () => nrTap(el));
  const cl = document.getElementById("cl"); if (cl) cl.onclick = () => { Q.tap = []; drawNr(); };
  const go = document.getElementById("go"); if (go) go.onclick = nrJudge;
  const nx = document.getElementById("nx"); if (nx) nx.onclick = () => { R.round++; nrRound(); };
}
function nrTap(el) {
  const id = el.dataset.id;
  if (Q.phase === "ask") { if (!Q.tap.includes(id) && Q.tap.length < 4) Q.tap.push(id); return drawNr(); }
  if (Q.phase !== "fix" || Q.tap.includes(id)) return;
  const right = Q.four.slice().sort(byYear)[Q.tap.length];   // 打ち直し: 正しい次の1つだけ受ける（判定は出さない）
  if (right.id !== id) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); return; }
  Q.tap.push(id);
  if (Q.tap.length === 4) Q.phase = "fixed";
  drawNr();
}
function nrJudge() {
  const four = Q.four, right = four.slice().sort(byYear).map(it => it.id);
  const ok = Q.tap.every((id, i) => id === right[i]);
  const byId = Object.fromEntries(four.map(it => [it.id, it]));
  const sec = Math.round((Date.now() - Q.t0) / 100) / 10;
  log({ mode: "naraberu", bundle: ERA[R.era].name, year: four.map(it => it.year).join("|"), event: four.map(it => it.event).join("|"),
        aEra: "", aYear: Q.tap.map(id => byId[id].year).join("|"), eraOk: "", yearOk: "", ok: +ok, sec, stage: "" });
  if (ok) { Q.mark = "ok"; drawNr(); const q = Q; setTimeout(() => { if (Q === q) { R.round++; nrRound(); } }, 600); return; }
  Q.phase = "fix"; Q.tap = []; drawNr();
}

// ───── 画面の切りかえ
$app.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const a = el.dataset.act;
  if (a === "home") home();
  else if (a === "oboeru") oboeru(el.dataset.b);
  else if (a === "junban") startRun("junban", el.dataset.b);
  else if (a === "mazeru") startRun("mazeru", el.dataset.b, +el.dataset.st);
  else if (a === "naraberu") naraberu(el.dataset.era);
});
if (!API) { const t = document.createElement("div"); t.id = "norec"; t.textContent = "きろくなし"; document.body.appendChild(t); $app.style.paddingTop = "16px"; }
// デバッグ: #test=junban:弥生 / #test=mazeru:平安①:2 / #test=naraberu:平安 / #test=oboeru:弥生 / #test=junban:弥生:ng（×の画面）/ #test=ov:heian
(function boot() {
  const m = decodeURIComponent(location.hash).match(/^#test=([a-z]+):([^:]+)(?::(.+))?$/);
  if (!m) return home();
  const [, mode, a0, opt] = m;
  const e0 = N.eras.find(e => e.name === a0 || e.id === a0), arg = mode === "naraberu" && e0 ? e0.id : a0;
  const firstEra = N.eras[0] && N.eras[0].id;
  if (mode === "oboeru") oboeru(arg);
  else if (mode === "naraberu") naraberu(arg);
  else if (mode === "mazeru") startRun("mazeru", arg, +(opt || 1));
  else if (mode === "ov") { startRun("junban", BUNDLES[0].name); openOv(arg); }
  else {
    startRun("junban", arg);
    if (opt === "ng") { Q.era = firstEra === Q.it.era ? (N.eras[1] || N.eras[0]).id : firstEra; Q.digits = "1234"; judge(); }
    else if (opt === "pad") { Q.era = Q.it.era; Q.digits = "57"; drawQ(); }
  }
  if (mode === "naraberu" && opt === "ng") { Q.tap = Q.four.slice().sort(byYear).reverse().map(it => it.id); nrJudge(); }
})();
flush();
</script>
