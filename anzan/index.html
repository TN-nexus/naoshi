<!DOCTYPE html>
<html lang="ja">
<head>

<title>あんざん</title>
<style>

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;font-size:18px;line-height:1.5;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
.head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 4px;font-size:15px;color:var(--sub)}
.head b{color:var(--ink);font-size:17px}
.ops{display:flex;gap:10px;justify-content:center;padding:10px 0 0}
.op{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:800;line-height:1}
.op.now{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--ink)}
#banner .ic{margin-bottom:18px}
.dots{display:flex;gap:5px;justify-content:center;padding:2px 0 6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.o{background:var(--ok)} .dots i.x{background:var(--ng)} .dots i.now{background:var(--sel)}
.streak{min-height:26px;text-align:center;font-weight:700;color:#c2410c;font-size:17px}
.main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 14px;min-height:0}
.inst{font-size:14px;color:var(--sub);margin-bottom:2px}
.inst.strong{font-size:18px;font-weight:700;color:#c2410c}
.ex{font-size:14px;color:var(--sub);margin-bottom:10px;font-variant-numeric:tabular-nums}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 8px;text-align:center;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.9}
.q.s{font-size:24px}
.q .t{white-space:nowrap}
.box{display:inline-block;cursor:pointer;min-width:62px;height:46px;line-height:42px;border:2px solid var(--line);border-radius:8px;padding:0 6px;margin:0 2px;vertical-align:middle;background:#fff;font-size:26px}
.q.s .box{min-width:54px;font-size:22px}
.box.now{border-color:var(--sel);background:var(--selbg)}
.box.done{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.box.bad{border-color:var(--ng);background:var(--ngbg)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.15;margin:0 3px}
.fr>span:first-child{border-bottom:2px solid var(--ink);padding:0 3px}
.q .fr .box{min-width:50px;height:40px;line-height:36px;font-size:22px;margin:2px 0}
.sq{display:inline-block;border:2px solid var(--ink);width:30px;height:34px;vertical-align:middle}
.q.f{font-size:24px;line-height:1.6}
.op.w{font-size:13px}
.msg{min-height:54px;text-align:center;font-size:17px;padding-top:8px}
.msg.ng{color:var(--ng);font-weight:700} .msg.ok{color:var(--ok);font-weight:700}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:8px 12px calc(12px + env(safe-area-inset-bottom))}
.pad button{font:inherit;font-size:26px;font-weight:700;height:58px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.pad button:active{background:var(--selbg)}
.pad .okb{background:var(--sel);color:#fff;border-color:var(--sel);font-size:20px}
.pad .del{font-size:18px;color:var(--sub)}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.center h1{font-size:28px;margin:0 0 12px}
.center p{margin:6px 0;color:var(--sub)}
.big{font:inherit;font-size:22px;font-weight:700;padding:16px 44px;border-radius:14px;border:0;background:var(--sel);color:#fff;margin-top:22px}
#fx{position:fixed;inset:0;pointer-events:none;display:none;z-index:9}
#banner{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(246,245,241,.96);z-index:8;text-align:center}
#banner .a{font-size:34px;font-weight:800} #banner .b{font-size:18px;color:var(--sub);margin-top:8px} #banner .c{font-size:20px;color:#c2410c;font-weight:700;margin-top:10px;min-height:28px}
table{border-collapse:collapse;font-size:13px;width:100%} td,th{border:1px solid var(--line);padding:3px 5px;text-align:left}
.oya{padding:14px;overflow:auto;height:100%}
</style>
</head>

<script>
// CORE-BEGIN（純粋関数。node で new Function に入れて単体を回せる）
const OPS = ["add", "sub", "mul", "div"];   // 山本塾の4種目（11/17）
// 11/24 朝3（パパ）: 計算の論点を4本ずつ回す。クリアした論点は消え、ORDER の次の論点が入る（ひき算・かけ算はクリア済みで外した）。
// ORDER＝娘の落ち方と大目的（組分けの大問1）で並べた順。新しい論点は計算くらぶ「計算力の土台」の形で端末が作る
const ORDER = ["add", "div", "fmd", "finv", "dsx", "mixas"];   // dsx＝÷小数（組分け06 大問1 の型。土台08 の小数→分数を1段目に含む）
const ACTIVE_N = 4;
const TRACKS = OPS.concat(["fmd", "finv", "dsx", "mixas", "d2f"]);
const OPN = { add: "たし算", sub: "ひき算", mul: "かけ算", div: "わり算", fmd: "分数のかけ・わり算", finv: "分数の逆算", mixas: "帯分数のたし・ひき算", d2f: "小数から分数", dsx: "小数と分数のかけ・わり算" };
const MAX = { add: 11, sub: 12, mul: 8, div: 10, fmd: 3, finv: 3, mixas: 3, d2f: 3, dsx: 3 };
const SIGN = { add: "+", sub: "−", mul: "×", div: "÷", fmd: "分×", finv: "□", mixas: "帯", d2f: "小分", dsx: "÷小" };
const FR = { fmd: 1, finv: 1, mixas: 1, d2f: 1, dsx: 1 };   // 分数で答える論点
const SET_N = 5;   // 1セット5問・5問とも最初の入力で正解なら次のレベル（11/17 夕5 パパ。診断は別）
const T_ANS = "計算しなさい。", T_TOP = "上のくらいから計算して、答えを入れなさい。";
const T_A2 = "10のくらいだけをたして、1のくらいだけをたしてから、答えをもとめなさい。";
const T_A3 = "100のくらいと10のくらいをたしてから、1のくらいをたして、答えをもとめなさい。";
const T_S3 = "100のくらいと10のくらいをひいてから、1のくらいをひいて、答えをもとめなさい。";
const T_M = "まず10のくらいとかけて、そのあと1のくらいとかけて、答えをもとめなさい。";
const T_R = "あまりももとめなさい。わりきれるときは、あまり 0 と入れなさい。";
// レベルの表: f＝形（ans 答えだけ／part 部品／mid 途中2つ＋答え／qr 商とあまり）、t＝指示、e＝例、r＝間違えたとき3箱で出す例（答えだけで分解がある段）
const LV = {
  add: [null,
    { f: "ans", t: T_ANS, e: "7 + 4 = 11" },
    { f: "ans", t: T_ANS, e: "67 + 8 = 75" },
    { f: "part", t: "1のくらいだけをたしなさい。", e: "67 + 28 ⇒ 15" },
    { f: "part", t: "10のくらいだけをたしなさい。", e: "67 + 89 ⇒ 140" },
    { f: "mid", t: T_A2, e: "67 + 22 = 80 + 9 = 89" },
    { f: "mid", t: T_A2, e: "67 + 28 = 80 + 15 = 95" },
    { f: "ans", t: T_TOP, e: "67 + 28 = 95", r: "67 + 28 = 80 + 15 = 95" },
    { f: "mid", t: T_A3, e: "235 + 81 = 310 + 6 = 316" },
    { f: "ans", t: T_TOP, e: "235 + 81 = 316", r: "235 + 81 = 310 + 6 = 316" },
    { f: "mid", t: T_A3, e: "317 + 524 = 830 + 11 = 841" },
    { f: "ans", t: T_TOP, e: "317 + 524 = 841", r: "317 + 524 = 830 + 11 = 841" }],
  sub: [null,
    { f: "ans", t: T_ANS, e: "9 − 7 = 2" },
    { f: "ans", t: T_ANS, e: "30 − 4 = 26" },
    { f: "ans", t: T_ANS, e: "15 − 2 = 13" },
    { f: "part", t: "1のくらいだけを答えなさい。", e: "32 − 4 ⇒ 8" },
    { f: "ans", t: T_ANS, e: "32 − 4 = 28" },
    { f: "part", t: "1のくらいだけを答えなさい。", e: "56 − 28 ⇒ 8" },
    { f: "mid", t: "まず10のくらいをひいて、そのあと1のくらいをひいて、答えをもとめなさい。", e: "67 − 28 = 47 − 8 = 39" },
    { f: "ans", t: T_TOP, e: "51 − 24 = 27", r: "67 − 28 = 47 − 8 = 39" },
    { f: "mid", t: T_S3, e: "437 − 54 = 387 − 4 = 383" },
    { f: "ans", t: T_TOP, e: "437 − 54 = 383", r: "437 − 54 = 387 − 4 = 383" },
    { f: "mid", t: T_S3, e: "628 − 157 = 478 − 7 = 471" },
    { f: "ans", t: T_TOP, e: "328 − 157 = 171", r: "628 − 157 = 478 − 7 = 471" }],
  mul: [null,
    { f: "ans", t: T_ANS, e: "3 × 5 = 15" },
    { f: "ans", t: T_ANS, e: "20 × 6 = 120" },
    { f: "mid", t: T_M, e: "17 × 5 = 50 + 35 = 85" },
    { f: "mid", t: T_M, e: "6 × 13 = 60 + 18 = 78" },
    { f: "ans", t: T_TOP, e: "13 × 4 = 52", r: "17 × 5 = 50 + 35 = 85" },
    { f: "mid", t: T_M, e: "34 × 3 = 90 + 12 = 102" },
    { f: "mid", t: T_M, e: "4 × 28 = 80 + 32 = 112" },
    { f: "ans", t: T_TOP, e: "32 × 6 = 192", r: "34 × 3 = 90 + 12 = 102" }],
  div: [null,
    { f: "ans", t: T_ANS, e: "15 ÷ 3 = 5" },
    { f: "qr", t: T_R, e: "17 ÷ 3 = 5 あまり 2" },
    { f: "ans", t: T_ANS, e: "150 ÷ 3 = 50" },
    { f: "ans", t: T_ANS, e: "36 ÷ 3 = 12" },
    { f: "qr", t: T_R, e: "65 ÷ 3 = 21 あまり 2" },
    { f: "ans", t: T_ANS, e: "3600 ÷ 30 = 120" },
    { f: "ans", t: T_ANS, e: "351 ÷ 3 = 117" },
    { f: "qr", t: T_R, e: "325 ÷ 3 = 108 あまり 1" },
    { f: "qr", t: T_R, e: "3568 ÷ 3 = 1189 あまり 1" },
    { f: "qr", t: T_R, e: "3568 ÷ 30 = 118 あまり 28" }],
  fmd: [null,
    { f: "fr", t: "計算しなさい。答えは約分しきった形で（仮分数は帯分数に）。", e: "18/25 × 20/27 = 8/15" },
    { f: "fr", t: "計算しなさい。答えは約分しきった形で（仮分数は帯分数に）。", e: "7/18 ÷ 14/27 = 3/4" },
    { f: "fr", t: "計算しなさい。答えは約分しきった形で（仮分数は帯分数に）。", e: "13/14 ÷ 39/56 = 1と1/3" }],
  finv: [null,
    { f: "fr", t: "□にあてはまる数を求めなさい。", e: "5/12 + □ = 3/4 → □ = 1/3" },
    { f: "fr", t: "□にあてはまる数を求めなさい。", e: "7/8 ÷ □ = 5/12 → □ = 2と1/10" },
    { f: "fr", t: "□にあてはまる数を求めなさい。", e: "3/5 − □ = 1/10 → □ = 1/2" }],
  mixas: [null,
    { f: "fr", t: "計算しなさい。答えは約分しきった形で。", e: "1と1/2 + 1と1/3 = 2と5/6" },
    { f: "fr", t: "計算しなさい。答えは約分しきった形で。", e: "2と5/6 − 1と3/4 = 1と1/12" },
    { f: "fr", t: "計算しなさい。答えは約分しきった形で。", e: "3と1/2 − 1と5/6 = 1と2/3" }],
  d2f: [null,
    { f: "fr", t: "分数に直しなさい。約分しきった形で。", e: "0.25 → 1/4" },
    { f: "fr", t: "分数に直しなさい。約分しきった形で。", e: "0.375 → 3/8" },
    { f: "fr", t: "分数に直しなさい。約分しきった形で（整数のあるときは帯分数）。", e: "2.375 → 2と3/8" }],
  dsx: [null,
    { f: "fr", t: "分数に直しなさい。約分しきった形で。", e: "0.375 → 3/8" },
    { f: "fr", t: "計算しなさい。答えは約分しきった形で（仮分数は帯分数に）。", e: "3/4 ÷ 0.375 = 2" },
    { f: "fr", t: "計算しなさい。答えは約分しきった形で（仮分数は帯分数に）。", e: "1.25 × 4/15 = 1/3" }],
};
// 分数（11/24）。[分子, 分母] で持つ。答えの箱は [整数, 分子, 分母]（整数が無いときは 0＝空のまま）
function gcd(a, b) { while (b) [a, b] = [b, a % b]; return a; }
function lcm(a, b) { return a / gcd(a, b) * b; }
function red(n, d) { const g = gcd(n, d); return [n / g, d / g]; }
function fadd(x, y) { return red(x[0] * y[1] + y[0] * x[1], x[1] * y[1]); }
function fsub(x, y) { return red(x[0] * y[1] - y[0] * x[1], x[1] * y[1]); }
function fmul(x, y) { return red(x[0] * y[0], x[1] * y[1]); }
function fdiv(x, y) { return red(x[0] * y[1], x[1] * y[0]); }
function mixed(x) { return [Math.floor(x[0] / x[1]), x[0] % x[1], x[1]]; }
function ftxt(x) { const m = mixed(x); return m[1] === 0 ? String(m[0]) : (m[0] ? `${m[0]}と${m[1]}/${m[2]}` : `${m[1]}/${m[2]}`); }
function fhtml(x) { const m = mixed(x); return `${m[0] ? m[0] : ""}<span class="fr"><span>${m[1]}</span><span>${m[2]}</span></span>`; }
const FDEN = [2, 3, 4, 5, 6, 8, 9, 10, 12, 15, 16, 18, 20, 24, 25];
function rfrac(rng, dens) { for (;;) { const d = pick(rng, dens || FDEN), n = ri(rng, 1, d - 1); if (gcd(n, d) === 1) return [n, d]; } }
function okAns(x, maxD) { return x[0] > 0 && x[0] % x[1] !== 0 && x[1] <= (maxD || 99); }
function genFr(op, lv, rng) {
  const fr = (q, qh, x) => ({ op, lv, f: "fr", q, qh, b: mixed(x), mid: null });
  if (op === "fmd") {   // 土台15: 真分数どうしの × ÷。たすきに約分が2か所ある形
    for (;;) {
      const div = lv === 1 ? false : lv === 2 ? true : rng() < 0.5;
      const p = ri(rng, 1, 9), q = ri(rng, 1, 9), r = ri(rng, 1, 9), t = ri(rng, 1, 9), g1 = ri(rng, 2, 9), g2 = ri(rng, 2, 9);
      let a, b, c, d;
      if (!div) { a = p * g1; b = q * g2; c = r * g2; d = t * g1; } else { a = p * g1; c = r * g1; b = q * g2; d = t * g2; }
      if (!(a < b && c < d && gcd(a, b) === 1 && gcd(c, d) === 1 && b <= 99 && d <= 99 && b >= 5 && d >= 5)) continue;
      const x = div ? fdiv([a, b], [c, d]) : fmul([a, b], [c, d]);
      if (!okAns(x, 60)) continue;
      const sg = div ? "÷" : "×";
      return fr(`${a}/${b} ${sg} ${c}/${d}`, `${fhtml([a, b])} ${sg} ${fhtml([c, d])} =`, x);
    }
  }
  if (op === "finv") {   // 土台16: □が1つ・計算が1つ。L1 たし・ひき、L2 かけ・わり、L3 まぜる
    const ADD = ["a+x", "x+a", "x-a", "a-x"], MUL = ["x*a", "a*x", "x/a", "a/x"];
    for (;;) {
      const form = pick(rng, lv === 1 ? ADD : lv === 2 ? MUL : ADD.concat(MUL));
      let A, B, X;
      if (form === "a+x" || form === "x+a") { X = rfrac(rng); A = rfrac(rng); B = fadd(A, X); }
      else if (form === "x-a") { B = rfrac(rng); A = rfrac(rng); X = fadd(B, A); }
      else if (form === "a-x") { X = rfrac(rng); B = rfrac(rng); A = fadd(X, B); }
      else if (form === "x*a" || form === "a*x") { X = rfrac(rng); A = rfrac(rng); B = fmul(A, X); }
      else if (form === "x/a") { B = rfrac(rng); A = rfrac(rng); X = fmul(B, A); }
      else { X = rfrac(rng); B = rfrac(rng); A = fmul(X, B); }
      if (!(A[0] < A[1] && B[0] < B[1] && A[1] <= 36 && B[1] <= 36 && okAns(X, 36) && X[0] / X[1] < 4)) continue;
      const sg = { "+": "＋", "-": "−", "*": "×", "/": "÷" }[form[1]], qa = fhtml(A), sq = `<span class="sq">□</span>`;
      const left = form[0] === "a" ? `${qa} ${sg} ${sq}` : `${sq} ${sg} ${qa}`;
      const tl = form[0] === "a" ? `${ftxt(A)} ${sg} □` : `□ ${sg} ${ftxt(A)}`;
      return fr(`${tl} = ${ftxt(B)}`, `${left} = ${fhtml(B)}<br>□ =`, X);
    }
  }
  if (op === "mixas") {   // 土台14: 帯分数 ± 帯分数（整数 1〜3）。ひき算は くり下がりのある問も出る
    const D = [2, 3, 4, 5, 6, 8, 9, 10, 12, 15, 18];
    for (;;) {
      const sub = lv === 1 ? false : lv === 2 ? true : rng() < 0.6;
      const f1 = rfrac(rng, D), f2 = rfrac(rng, D), w1 = ri(rng, 1, 3), w2 = ri(rng, 1, 3);
      if (lcm(f1[1], f2[1]) > 36) continue;
      const A = red(w1 * f1[1] + f1[0], f1[1]), B = red(w2 * f2[1] + f2[0], f2[1]);
      if (sub && A[0] * B[1] <= B[0] * A[1]) continue;
      const x = sub ? fsub(A, B) : fadd(A, B);
      if (!okAns(x)) continue;
      const sg = sub ? "−" : "＋";
      return fr(`${ftxt(A)} ${sg} ${ftxt(B)}`, `${fhtml(A)} ${sg} ${fhtml(B)} =`, x);
    }
  }
  if (op === "dsx") {   // ÷小数: 小数を分数に直して計算（L1 直すだけ、L2 分数 ÷ 小数・分数 × 小数、L3 整数つきの小数もまぜる）
    const D1 = ["2", "4", "6", "8", "5", "25", "75", "125", "375", "625", "875", "05", "15", "35", "45", "55", "85"];
    for (;;) {
      const fp = pick(rng, D1), w = lv === 3 ? ri(rng, 0, 2) : lv === 1 ? (rng() < 0.3 ? 1 : 0) : 0;
      const den = Math.pow(10, fp.length), dv = red(w * den + parseInt(fp, 10), den), dec = `${w}.${fp}`;
      if (lv === 1) { if (!okAns(dv)) continue; return fr(`${dec} → 分数`, `${dec} を分数に<br>`, dv); }
      const a = rfrac(rng, [2, 3, 4, 5, 6, 7, 8, 9, 10, 12, 14, 15, 16, 18, 20, 21, 24, 25, 27]);
      const kind = lv === 2 ? pick(rng, ["d", "d", "m"]) : pick(rng, ["d", "m", "m2"]);
      let x, q, qh;
      if (kind === "d") { x = fdiv(a, dv); q = `${ftxt(a)} ÷ ${dec}`; qh = `${fhtml(a)} ÷ ${dec} =`; }
      else if (kind === "m") { x = fmul(a, dv); q = `${ftxt(a)} × ${dec}`; qh = `${fhtml(a)} × ${dec} =`; }
      else { x = fmul(dv, a); q = `${dec} × ${ftxt(a)}`; qh = `${dec} × ${fhtml(a)} =`; }
      const gc = kind === "d" ? gcd(a[0], dv[0]) * gcd(a[1], dv[1]) : gcd(a[0], dv[1]) * gcd(a[1], dv[0]);
      if (gc < 2 || !okAns(x, 60) || x[0] / x[1] > 9) continue;   // 約分が1つはある問だけ
      return fr(q, qh, x);
    }

  if (f === "mid") return `<span class="t">${esc(P.q)} =</span> <span class="t">${b(0)} ${j} ${b(1)}</span> <span class="t">= ${b(2)}</span>`;
  if (f === "qr") return `<span class="t">${esc(P.q)} =</span> <span class="t">${b(0)} あまり ${b(1)}</span>`;
  if (f === "part") return `<span class="t">${esc(P.q)} ⇒ ${b(0)}</span>`;
  return `<span class="t">${esc(P.q)} = ${b(0)}</span>`;
}
function render() {
  const L = LV[P.op][P.lv];
  let headR = "", dots = "";
  if (kind === "diag") headR = "しらべているよ";
  else {
    const st = S.set;
    headR = kind === "extra" ? "さいごの1問" : `${Math.min(st.i + 1, SET_N)}／${SET_N}`;
    dots = `<div class="dots">${Array.from({ length: SET_N }, (_, i) => `<i class="${i < st.marks.length ? (st.marks[i] ? "o" : "x") : i === st.i ? "now" : ""}"></i>`).join("")}</div>`;
  }
  const inst = mode === "redo" ? "上のくらいから、分けてやってみよう。" : L.t;
  const ex = mode === "redo" ? L.r : (kind === "diag" && P.f === "mid" && L.f === "ans") ? L.r : L.e;
  const instD = (kind === "diag" && P.f === "mid" && L.f === "ans") ? "上のくらいから分けて、答えをもとめなさい。" : inst;
  $app.innerHTML = `
    ${kind === "diag" ? "" : iconsHtml(P.op)}
    <div class="head"><b>${OPN[P.op]} レベル${P.lv}</b><span>${headR}</span></div>${dots}
    <div class="streak">${S.streak >= 2 ? `🔥 ${S.streak}問れんぞく正解` : ""}</div>
    <div class="main">
      <div class="inst${P.f === "part" ? " strong" : ""}">${esc(instD)}</div><div class="ex">（例）${esc(ex)}</div>
      <div class="q${(P.f === "mid" || P.f === "qr") ? " s" : P.f === "fr" ? " f" : ""}">${boxesHtml()}</div>
      <div class="msg ${msgCls}">${msg || (P.f === "fr" ? ["整数があれば入れて「つぎ」。なければ空のまま「つぎ」", "分子を入れて「つぎ」", "分母を入れて「OK」"][bi] : P.b.length > 1 && bi < P.b.length - 1 ? "入れたら「つぎ」で、となりの箱へ" : "")}</div>
    </div>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join("")}<button class="del" data-k="del">けす</button><button data-k="0">0</button><button class="okb" data-k="ok">${bi < P.b.length - 1 ? "つぎ ▶" : "OK"}</button></div>`;
}
function key(k) {
  if (lock || !P) return;
  if (k === "del") buf = buf.slice(0, -1);
  else if (k === "ok") return submit();
  else if (buf.length < 6) buf = (buf === "0" ? "" : buf) + k;
  render();
}
$app.addEventListener("click", e => {
  const b = e.target.closest("button[data-k]"); if (b) return key(b.dataset.k);
  const x = e.target.closest(".box[data-i]");   // 先の箱をタップ＝いまの箱を決定して進む（空なら案内だけ）
  if (x && !lock && P && +x.dataset.i > bi) { if (buf !== "" || (P.f === "fr" && bi === 0)) submit(); else { msg = "さきに、青い箱に数字を入れてね"; msgCls = ""; render(); } }
});
document.addEventListener("keydown", e => {
  if (/^[0-9]$/.test(e.key)) key(e.key); else if (e.key === "Backspace") key("del"); else if (e.key === "Enter") key("ok");
});
function submit() {
  if (buf === "" && !(P.f === "fr" && bi === 0)) return;
  const v = buf === "" ? 0 : parseInt(buf, 10), want = P.b[bi];
  if (mode === "first" && firstTry) firstIn += (firstIn ? "," : "") + v;
  if (v === want) {
    vals[bi] = v; bi++; buf = ""; hint = null; msg = ""; msgCls = "";
    if (bi >= P.b.length) return complete();
    return render();
  }
  // まちがい
  if (firstTry) { firstTry = false; ms1 = Math.round(performance.now() - t0); }
  buf = "";
  if (kind === "diag") return complete();
  if (mode === "first" && P.f === "ans" && P.mid) {   // 答えだけの問 → 同じ問を3箱で
    mode = "redo"; P = Object.assign({}, P, { f: "mid", b: P.mid }); bi = 0; vals = []; hint = null;
    msg = "ちがうよ。分けてやってみよう。"; msgCls = "ng";
    return render();
  }
  hint = want;
  if (P.f === "fr") {   // 11/24（W219）: 1回目は数を見せずにヒント、2回目に数を見せる。どちらも本人が入れて進む
    P.miss = P.miss || [0, 0, 0]; const n = ++P.miss[bi];
    if (n === 1) msg = bi === 0 ? (want ? "整数の部分がちがうよ。仮分数のままになっていない？" : "整数はないよ。空のまま「つぎ」") : `${bi === 1 ? "分子" : "分母"}がちがうよ。約分しきった？ もう一度。`;
    else msg = bi === 0 ? (want ? `整数は ${want}。入れてすすもう。` : "整数はなし。空のまま「つぎ」") : `ここは ${want}。入れてすすもう。`;
  }
  else msg = `ここは ${want}。入れてすすもう。`;
  msgCls = "ng";
  render();
}
function complete() {
  lock = true;
  const total = Math.round(performance.now() - t0);
  if (firstTry) ms1 = total;
  const orig = S.p.p;
  rec({ kind, op: orig.op, lv: orig.lv, f: orig.f, q: orig.q, a: firstIn, c: orig.b.join(","), ok: firstTry ? 1 : 0, ms: ms1, ms2: total, n: S.set ? S.set.i + 1 : S.diag.lv, hid: hid ? 1 : 0 });
  msg = firstTry ? "○ せいかい" : (kind === "diag" ? "×" : "できた。つぎへ"); msgCls = firstTry ? "ok" : (kind === "diag" ? "ng" : "");
  render();
  setTimeout(after, firstTry ? 380 : 700);
}
function after() {
  S.p = null;
  S.streak = firstTry ? S.streak + 1 : 0;   // 調べ直しの問も数える（パパ 11/17 夜）
  if (kind === "diag") {
    diagStep(S, firstTry); save();
    if (S.phase === "run") return banner("しらべおわり", "ここからスタート", active(S).map(o => `${OPN[o]} ${S.cur[o]}`).join("　"), 2600, next);
    return next();
  }
  const st = S.set;
  if (kind === "set") { st.marks.push(firstTry ? 1 : 0); if (firstTry) st.ok++; st.i++; }
  const needExtra = (kind === "set" && st.i >= SET_N && !firstTry) || (kind === "extra" && !firstTry);
  if (st.i < SET_N || needExtra) { save(); return next(); }
  const score = st.ok, name = `${OPN[st.op]} レベル${st.lv}`, op = st.op;
  endSet(S); save();
  fireworks();
  if (S.res === "clear") return banner(`${OPN[op]} クリア！`, "さいごの段までできたよ。おめでとう！", S.phase === "grad" ? "" : S.added ? `つぎの論点「${OPN[S.added]}」が入ったよ` : "のこりの論点をつづけよう", 3600, next);
  banner("できた！", `${name}　${SET_N}問中 ${score}問`, S.res === "up" ? "つぎは レベルアップ" : S.res === "down" ? "つぎは 前の段で かためよう" : "つぎも この段。5問ぜんぶ正解でレベルアップ", 2200, next);
}
function banner(a, b, c, ms, cb, nowOp) {
  $banner.querySelector(".ic").innerHTML = S.phase === "run" || S.phase === "grad" ? iconsHtml(nowOp || "") : "";
  $banner.querySelector(".a").textContent = a; $banner.querySelector(".b").textContent = b; $banner.querySelector(".c").textContent = c || "";
  $banner.style.display = "flex"; $app.innerHTML = "";
  setTimeout(() => { $banner.style.display = "none"; cb(); }, ms);
}
function fireworks() {
  const c = $fx, x = c.getContext("2d"), W = c.width = innerWidth, H = c.height = innerHeight;
  c.style.display = "block";
  const cols = ["#e11d48", "#f59e0b", "#10b981", "#3b82f6", "#a855f7", "#f97316"], ps = [];
  const burst = () => { const bx = W * (0.2 + Math.random() * 0.6), by = H * (0.15 + Math.random() * 0.35), col = cols[Math.floor(Math.random() * cols.length)];
    for (let i = 0; i < 46; i++) { const an = Math.PI * 2 * i / 46, sp = 2 + Math.random() * 4; ps.push({ x: bx, y: by, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp, l: 1, col }); } };
  burst(); const tm = [setTimeout(burst, 300), setTimeout(burst, 650), setTimeout(burst, 1000), setTimeout(burst, 1350)];
  const start = performance.now();
  (function step() {
    x.clearRect(0, 0, W, H);
    for (const p of ps) { p.x += p.vx; p.y += p.vy; p.vy += 0.07; p.vx *= 0.985; p.l -= 0.014; if (p.l > 0) { x.globalAlpha = p.l; x.fillStyle = p.col; x.beginPath(); x.arc(p.x, p.y, 3.2, 0, 7); x.fill(); } }
    x.globalAlpha = 1;
    if (performance.now() - start < 2200) requestAnimationFrame(step); else { c.style.display = "none"; tm.forEach(clearTimeout); }
  })();
}
function oya() {   // パパ用（?oya=1）。この端末に残っている記録と現在地
  const all = ls.get(LKEY, []), by = {};
  for (const r of all) { if (r.kind === "diag") continue; const k = `${OPN[r.op]} L${r.lv} ${r.f}`; const o = by[k] || (by[k] = { n: 0, ok: 0, ms: 0 }); o.n++; o.ok += r.ok; o.ms += r.ms; }
  const rows = Object.keys(by).sort().map(k => `<tr><td>${k}</td><td>${by[k].n}</td><td>${by[k].ok}</td><td>${(by[k].ms / by[k].n / 1000).toFixed(1)}</td></tr>`).join("");
  const tail = all.slice(-40).reverse().map(r => `<tr><td>${r.ts.slice(5, 16)}</td><td>${r.kind}</td><td>${OPN[r.op]}${r.lv}</td><td>${esc(r.q)}</td><td>${r.ok ? "○" : "×"} ${esc(r.a)}</td><td>${esc(r.c)}</td><td>${(r.ms / 1000).toFixed(1)}</td></tr>`).join("");
  $app.innerHTML = `<div class="oya"><p><b>現在地</b>（${S.phase}・${S.sets}セット済）: ${active(S).map(o => `${OPN[o]} ${S.cur[o]}`).join("／")}（クリア ${Object.keys(S.cleared).filter(o => S.cleared[o]).map(o => OPN[o]).join("・") || "なし"}）　送り待ち ${ls.get(QKEY, []).length}行</p>
    <table><tr><th>レベル・形</th><th>問</th><th>○</th><th>平均秒</th></tr>${rows}</table><p><b>新しい40問</b></p>
    <table><tr><th>時刻</th><th>種類</th><th>段</th><th>式</th><th>入力</th><th>正解</th><th>秒</th></tr>${tail}</table>
    <p><button id="rs">診断からやり直す（2回おす）</button></p></div>`;
  let n = 0; document.getElementById("rs").onclick = () => { if (++n >= 2) { S = newState(); save(); location.search = location.search.replace(/[?&]oya=1/, ""); } };
}
getKey();
if (OYA) oya(); else next();
