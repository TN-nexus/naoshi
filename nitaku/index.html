<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>にたく</title>
<link rel="icon" href="data:,">
<style>
/* ねんだい（apps/nendai/page.html）と同じ色・字。スマホ縦 390px を先に作る */
:root{
  --bg:#f6f5f1; --card:#fff; --ink:#1f2328; --sub:#6b6f76; --line:#d9d6cf;
  --ok:#1f7a4d; --ng:#b3261e; --sel:#2b5cb8; --selbg:#e6eefc;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;font-size:18px;line-height:1.7;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:12px 14px 40px;min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
#norec{position:fixed;top:1px;right:6px;font-size:10px;line-height:1.2;color:var(--sub);z-index:50}
.small{font-size:14px;color:var(--sub)}
.bar{display:grid;grid-template-columns:4.5em 1fr 4.5em;align-items:center;gap:6px;padding:2px 2px 8px;border-bottom:1px solid var(--line);margin-bottom:14px;min-height:40px}
.tag{justify-self:start;font-size:13px;line-height:1.5;padding:1px 8px;border-radius:6px;white-space:nowrap}
.tag.社会{background:#fbe6d2;color:#8a4a12} .tag.理科{background:#dcefdc;color:#2c6a32} .tag.国語{background:#e8e0f4;color:#5b3d8a}
.dots{text-align:center;font-size:15px;letter-spacing:.12em;color:var(--sub);white-space:nowrap}
.menu{justify-self:end;border:1px solid var(--line);background:#fff;border-radius:8px;padding:0 12px;font-size:18px;line-height:1.6}
.mn{position:absolute;right:14px;top:52px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;z-index:30;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.mn button{border:1.5px solid var(--ink);background:#fff;border-radius:8px;padding:8px 14px;font-size:16px}
.mn button.danger{border-color:var(--ng);color:var(--ng)}
.q{font-size:20px;line-height:1.6;padding:6px 2px 10px;white-space:pre-wrap}
.sp{flex:1}
.ch{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.c{min-height:68px;font-size:22px;line-height:1.35;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;text-align:center}
.c.big{font-size:34px;font-weight:700;letter-spacing:.06em}
.c:disabled{cursor:default;opacity:1;color:inherit}
.c.right{border-color:var(--ok);color:var(--ok);font-weight:800;border-width:3px}
.c.picked-ng{color:#9a9a9a;text-decoration:line-through;background:#f1f0ec}
.hint{font-size:16px;color:var(--ink);margin:2px 4px 0}
.next{display:block;width:100%;margin-top:12px;font-size:19px;font-weight:700;padding:13px;border-radius:10px;border:2px solid var(--ink);background:#fff}
.nextph{height:59px;margin-top:12px}
.end{font-size:20px;text-align:center;margin:30vh 0 16px}
#fw{position:fixed;inset:0;pointer-events:none;z-index:45}
#err{position:fixed;left:0;right:0;bottom:0;background:#fff3f2;color:var(--ng);font-size:12px;white-space:pre-wrap;padding:4px 8px;z-index:60;display:none}
</style>
</head>
<body>
<div id="app"><p class="small">よみこみ中…</p></div>
<div id="err"></div>
<script>
window.onerror = (m, s, l, c) => { const e = document.getElementById("err"); e.style.display = "block"; e.textContent += `${m} (${l}:${c})\n`; };
</script>
<script src="data.js"></script>
<script>
// CORE-BEGIN 出題の規則（純粋関数。node で単体を確かめる: apps/nitaku/README.md）
const SUBJ = ["社会", "理科", "国語"];
const SET_N = 10;
function newState() { return { v: 1, lap: 1, si: 0, st: {}, retryQ: {}, recheckQ: {}, lastSet: {}, set: null, lastKey: "", over: false }; }
function stOf(S, k) { return S.st[k] || (S.st[k] = { seen: 0, okStreak: 0, wrong: 0, retired: false, lap: 0 }); }
// 1教科ぶんのセットを作る（S を書きかえる）。空なら null
function buildSet(S, items, s) {
  const pool = items.filter(it => it.s === s && !stOf(S, it.k).retired);
  if (!pool.length) return null;
  const by = Object.fromEntries(pool.map(it => [it.k, it]));
  const last = new Set(S.lastSet[s] || []);
  const out = [], used = new Set();
  const add = (k, from) => { if (out.length < SET_N && by[k] && !used.has(k)) { used.add(k); out.push({ k, from }); return true; } return false; };
  // ① 前のセットの×
  const rq = (S.retryQ[s] || []).slice(); S.retryQ[s] = [];
  for (const k of rq) if (!add(k, "retry") && by[k] && !used.has(k)) (S.retryQ[s] = S.retryQ[s] || []).push(k);
  // ② この周で未出題を p の高い順、src をラウンドロビン
  const fresh = pool.filter(it => stOf(S, it.k).lap < S.lap && !used.has(it.k) && !(S.recheckQ[s] || []).includes(it.k));
  const groups = {};
  for (const it of fresh) (groups[it.src || ""] = groups[it.src || ""] || []).push(it);
  const gl = Object.values(groups).map(g => g.sort((a, b) => (b.p || 0) - (a.p || 0)));
  gl.sort((a, b) => (b[0].p || 0) - (a[0].p || 0));
  for (let r = 0; out.length < SET_N && gl.some(g => g.length > r); r++)
    for (const g of gl) if (g[r]) add(g[r].k, "new");
  // ③ 足りなければ recheck（直前のセットに出たものは後回し）
  const rc = (S.recheckQ[s] || []).filter(k => by[k]);
  for (const k of rc.filter(k => !last.has(k))) add(k, "recheck");
  if (!out.length) for (const k of rc) add(k, "recheck");
  S.recheckQ[s] = rc.filter(k => !used.has(k));
  if (!out.length) return null;
  // 直前に答えた問と同じ問を続けない
  if (out.length > 1 && out[0].k === S.lastKey) [out[0], out[1]] = [out[1], out[0]];
  return out;
}
// 次のセット（教科のループ）。尽きたら S.over
function nextSet(S, items, rnd = Math.random) {
  for (let t = 0; t < SUBJ.length; t++) {
    const s = SUBJ[(S.si + t) % SUBJ.length];
    const ent = buildSet(S, items, s);
    if (!ent) continue;
    S.si = (S.si + t + 1) % SUBJ.length;
    const by = Object.fromEntries(items.map(it => [it.k, it]));
    S.set = { s, i: 0, ans: [], q: ent.map(e => {
      const it = by[e.k], st = stOf(S, e.k);
      const wrong = it.w2 && st.seen % 2 === 1 ? it.w2 : it.w;
      return { k: e.k, from: e.from, wrong, top: rnd() < 0.5 ? "a" : "w" };
    }) };
    return S.set;
  }
  S.set = null; S.over = true;
  return null;
}
// 1回答を反映（S を書きかえる）
function answer(S, s, k, from, ok) {
  const st = stOf(S, k);
  st.seen++; st.lap = S.lap;
  const rm = (Q) => { if (Q[s]) Q[s] = Q[s].filter(x => x !== k); };
  rm(S.recheckQ); rm(S.retryQ);
  if (!ok) { st.wrong++; st.okStreak = 0; (S.retryQ[s] = S.retryQ[s] || []).push(k); }
  else if (st.wrong > 0) { st.okStreak++; if (st.okStreak >= 2) st.retired = true; else (S.recheckQ[s] = S.recheckQ[s] || []).push(k); }
  else if (from === "recheck") st.retired = true;
  else (S.recheckQ[s] = S.recheckQ[s] || []).push(k);
  S.lastKey = k;
}
function endSet(S) { if (S.set) S.lastSet[S.set.s] = S.set.q.map(e => e.k); S.set = null; }
function newLap(S) {
  S.lap++; S.over = false; S.retryQ = {}; S.recheckQ = {};
  for (const k in S.st) { S.st[k].retired = false; S.st[k].okStreak = 0; }
}
if (typeof module !== "undefined") module.exports = { SUBJ, newState, stOf, buildSet, nextSet, answer, endSet, newLap };
// CORE-END
</script>
<script>
// にたく（apps/nitaku/README.md）。1画面1問の二択。点数・連続記録・残り数は出さない
const N = (typeof NITAKU !== "undefined" && NITAKU) || window.NITAKU || { built: "", items: [] };
const ITEMS = N.items;
const BY = Object.fromEntries(ITEMS.map(it => [it.k, it]));
const params = new URLSearchParams(location.search);
const DEPLOY = params.get("d") || "";
const API = DEPLOY ? `https://script.google.com/macros/s/${encodeURIComponent(DEPLOY)}/exec` : "";
const TRY = params.get("try") === "1";
const SKEY = TRY ? "nitaku.state.try" : "nitaku.state.v1", QKEY = TRY ? "nitaku.queue.try" : "nitaku.queue.v1", DKEY = "nendai.dev";
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let DEV = TRY ? "テスト-パパ" : ls.get(DKEY, "");
if (!DEV) { DEV = "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); ls.set(DKEY, DEV); }

function ts() {
  const d = new Date(), p = n => String(n).padStart(2, "0"), o = -d.getTimezoneOffset();
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}${o >= 0 ? "+" : "-"}${p(Math.floor(Math.abs(o) / 60))}:${p(Math.abs(o) % 60)}`;
}
let flushing = false;
function log(args) {
  if (!API) return;
  const q = ls.get(QKEY, []);
  q.push(Object.assign({ dev: DEV, ts: ts() }, args));
  ls.set(QKEY, q);
  flush();
}
async function flush() {
  if (!API || flushing) return;
  flushing = true;
  try {
    for (;;) {
      const q = ls.get(QKEY, []);
      if (!q.length) break;
      const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, credentials: "omit",
                                   body: JSON.stringify({ app: "nendai", op: "log", args: q[0] }) });
      if (!r.ok) break;
      const q2 = ls.get(QKEY, []);
      q2.shift(); ls.set(QKEY, q2);
    }
  } catch (e) { /* 次の機会に */ }
  flushing = false;
}
window.addEventListener("online", flush);
document.addEventListener("visibilitychange", () => { if (!document.hidden) flush(); });

// ───── 状態
let S = ls.get(SKEY, null);
if (!S || S.v !== 1) S = newState();
// data.js が差し替わって消えた問はセットから外す
if (S.set) { S.set.q = S.set.q.filter(e => BY[e.k]); if (S.set.i >= S.set.q.length) endSet(S); }
const save = () => ls.set(SKEY, S);
let t0 = Date.now(), timer = null, menuOpen = 0;

function render() {
  clearTimeout(timer); timer = null;
  if (!S.set && !S.over) nextSet(S, ITEMS);
  save();
  if (S.over || !S.set) return drawEnd();
  drawQ();
}
function barHtml() {
  const set = S.set;
  const dots = set.q.map((e, j) => j < set.i || (j === set.i && set.ans[j]) ? "●" : j === set.i ? "◎" : "○").join("");
  return `<div class="bar"><span class="tag ${esc(set.s)}">${esc(set.s)}</span><span class="dots">${dots}</span><button class="menu" id="mb">…</button></div>` +
    (menuOpen ? `<div class="mn">${menuOpen === 1 ? `<button id="m1">最初から</button>` : `<button class="danger" id="m2">ほんとうに最初から</button>`}<button id="m0">やめる</button></div>` : "");
}
function drawQ() {
  const set = S.set, e = set.q[set.i], it = BY[e.k], done = set.ans[set.i];
  const big = it.src === "漢字";
  const opts = e.top === "a" ? [it.a, e.wrong] : [e.wrong, it.a];
  const btn = (txt, idx) => {
    let cls = "c" + (big ? " big" : "");
    if (done) { if (txt === it.a) cls += " right"; else if (done.pick === idx) cls += " picked-ng"; }
    return `<button class="${cls}" data-i="${idx}" ${done ? "disabled" : ""}>${esc(txt)}</button>`;
  };
  let tail = "";
  if (done && !done.ok) {
    tail = (it.hint ? `<div class="hint">${esc(it.hint)}</div>` : "") +
      (done.nx || Date.now() - done.at >= 1500 ? `<button class="next" id="nx">つぎ</button>` : `<div class="nextph"></div>`);
  }
  const bs = [btn(opts[0], 0), btn(opts[1], 1)];
  const hintAt = done && !done.ok ? (opts[0] === it.a ? 1 : 2) : -1;   // 正解の下に一言
  let chHtml = "";
  bs.forEach((b, j) => { chHtml += b; if (hintAt === j + 1) chHtml += tail; });
  $app.innerHTML = barHtml() + `<div class="q">${esc(it.q)}</div><div class="sp"></div><div class="ch">${chHtml}</div>`;
  bindMenu();
  $app.querySelectorAll(".c[data-i]").forEach(el => el.onclick = () => pick(+el.dataset.i, opts));
  const nx = document.getElementById("nx"); if (nx) nx.onclick = advance;
  if (done && !done.ok && !done.nx) timer = setTimeout(() => { done.nx = 1; save(); drawQ(); }, Math.max(0, 1500 - (Date.now() - done.at)));
  if (done && done.ok) timer = setTimeout(advance, 700);
  if (!done) t0 = Date.now();
}
function pick(idx, opts) {
  const set = S.set, e = set.q[set.i], it = BY[e.k];
  if (set.ans[set.i]) return;
  const ok = opts[idx] === it.a;
  const sec = Math.round((Date.now() - t0) / 100) / 10;
  answer(S, set.s, e.k, e.from, ok);
  set.ans[set.i] = { pick: idx, ok: ok ? 1 : 0, at: Date.now() };
  save();
  log({ mode: TRY ? "nitaku_try" : "nitaku", stage: it.s, bundle: `${it.m}|${it.n}`, year: String(S.st[e.k].seen),
        event: String(it.q).slice(0, 300), aEra: opts[idx], aYear: it.a, ok: ok ? 1 : 0, sec });
  drawQ();
}
function advance() {
  clearTimeout(timer); timer = null;
  const set = S.set;
  if (!set) return render();
  set.i++;
  if (set.i < set.q.length) { save(); return drawQ(); }
  const all = set.ans.every(a => a && a.ok);
  endSet(S); save();
  if (all) fireworks(render); else render();
}
function drawEnd() {
  $app.innerHTML = `<div class="end">おわり。もう一周する？</div><button class="next" id="again">もう一周</button>`;
  document.getElementById("again").onclick = () => { newLap(S); save(); render(); };
}
function bindMenu() {
  document.getElementById("mb").onclick = () => { menuOpen = menuOpen ? 0 : 1; drawQ(); };
  const m1 = document.getElementById("m1"); if (m1) m1.onclick = () => { menuOpen = 2; drawQ(); };
  const m0 = document.getElementById("m0"); if (m0) m0.onclick = () => { menuOpen = 0; drawQ(); };
  const m2 = document.getElementById("m2"); if (m2) m2.onclick = () => { menuOpen = 0; S = newState(); save(); render(); };
}
// 全○のときだけ: 色の粒が広がるだけ（1.5秒・音なし・数字なし）
function fireworks(then) {
  const cv = document.createElement("canvas"); cv.id = "fw";
  const W = cv.width = innerWidth, H = cv.height = innerHeight;
  document.body.appendChild(cv);
  const g = cv.getContext("2d"), cols = ["#e85d4a", "#f2b134", "#3fa66b", "#3b7dd8", "#a25bd6", "#f07fb0"], ps = [];
  for (let b = 0; b < 4; b++) {
    const cx = W * (0.2 + 0.6 * Math.random()), cy = H * (0.2 + 0.35 * Math.random());
    for (let i = 0; i < 46; i++) { const a = Math.random() * 6.283, v = 1.5 + Math.random() * 4; ps.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, c: cols[(b + i) % cols.length], d: b * 180 }); }
  }
  const st = performance.now();
  (function f(now) {
    const t = now - st;
    g.clearRect(0, 0, W, H);
    for (const p of ps) {
      const tt = (t - p.d) / 16; if (tt < 0) continue;
      g.globalAlpha = Math.max(0, 1 - (t - p.d) / 1100);
      g.fillStyle = p.c; g.beginPath(); g.arc(p.x + p.vx * tt, p.y + p.vy * tt + 0.03 * tt * tt, 3.2, 0, 6.283); g.fill();
    }
    if (t < 1500) requestAnimationFrame(f); else { cv.remove(); then(); }
  })(st);
}

if (TRY) {
  document.body.insertAdjacentHTML("afterbegin", '<div id="trybar" style="position:fixed;top:0;left:0;right:0;z-index:55;background:var(--selbg);color:var(--sel);border-bottom:1px solid var(--line);font-size:14px;line-height:1.6;text-align:center;padding:2px 8px">試し（記録しない）</div>');
  document.body.style.paddingTop = "26px";
}
if (!API) { const t = document.createElement("div"); t.id = "norec"; t.textContent = "きろくなし"; document.body.appendChild(t); $app.style.paddingTop = "16px"; }
if (!ITEMS.length) $app.innerHTML = `<p class="small">データがありません</p>`; else render();
flush();
</script>
</body>
