<script>
// データの差し替え: ?set=5B11 → flow_data_5B11.js（帰りのバス）。無ければ flow_data.js（行きのバス 5B10）
const SET = (/^[0-9A-Za-z]{1,12}$/.test(new URLSearchParams(location.search).get("set") || "") ? new URLSearchParams(location.search).get("set") : "");
document.write(`<script src="${SET ? "flow_data_" + SET + ".js" : "flow_data.js"}"><\/script>`);
</script>
<script>
// CORE-BEGIN 流れの規則（純粋関数。node で単体: apps/nitaku/README.md）
// 1本の列 steps: 「T|教科」最上段（その教科が初めて出る直前に1回）→「D|上段ID」段 →「Q|問」その上段の問を全部 → 次のブロック（理社交互）。
// ブロック（上段）の問で×だったら、そのブロックの末尾（次の段の前）に「R|問」を差し込み、その場で1回再出（段なし。また×でも先へ）。
// 全体の最後のやり直しは無い（11/9 16:10 パパ「論点の区切りで、流れないように」）。区切り（10問）は無い
function shuffle(a, rnd = Math.random) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function buildSteps(F) {
  const st = [], seen = {}, by = Object.fromEntries(F.items.map(i => [i.k, i]));
  for (const b of F.blocks) {
    const ks = b.ks.filter(k => by[k]); if (!ks.length || (b.j && !F.J[b.j])) continue;
    if (!b.j) { st.push("H|おぼえる語"); ks.forEach(k => st.push("Q|" + k)); continue; }   // 上段に乗らない語: 段なしの見出しブロック
    const s = F.J[b.j].s;
    if (!seen[s]) { seen[s] = 1; if (F.T && F.T[s] && F.T[s].length) st.push("T|" + s); }
    st.push("D|" + b.j);
    ks.forEach(k => st.push("Q|" + k));
  }
  return st;
}
function newState(F) { return { v: 4, steps: buildSteps(F), pos: 0, done: [], wrong: [], cur: null }; }
// データが差し替わったら: 消えた問・上段は飛ばし、新しい問はその段ごと後ろに足す
function syncState(S, F) {
  const by = Object.fromEntries(F.items.map(i => [i.k, i])), ok = st => st[0] === "Q" || st[0] === "R" ? !!by[st.slice(2)] : st[0] === "D" ? !!F.J[st.slice(2)] : true;
  const before = S.steps.slice(0, S.pos).filter(ok).length;
  S.steps = S.steps.filter(ok); S.pos = before;
  const have = new Set(S.steps.filter(x => x[0] === "Q").map(x => x.slice(2)));
  const jOf = x => !x ? "" : x[0] === "D" ? x.slice(2) : x[0] === "Q" || x[0] === "R" ? by[x.slice(2)].jodan : "";
  for (const st of buildSteps(F)) {
    if (st[0] !== "Q" || have.has(st.slice(2))) continue;
    const j = by[st.slice(2)].jodan;
    if (jOf(S.steps[S.steps.length - 1]) !== j) S.steps.push("D|" + j);
    S.steps.push(st);
  }
  S.wrong = S.wrong.filter(k => by[k]); S.done = S.done.filter(k => by[k]);
  if (S.cur && !by[S.cur.k]) S.cur = null;
  return S;
}
// いまの画面: T|教科・D|上段・Q|問・R|問（ブロック内の再出）・END
function step(S) { return S.pos < S.steps.length ? S.steps[S.pos] : "END"; }
// 問の画面の中身（並びは1回だけ決めて保存）
function curEntry(S, F, rnd = Math.random) {
  const st = step(S); if (!/^[QR]\|/.test(st)) return null;
  const k = st.slice(2);
  if (!S.cur || S.cur.k !== k) {
    const it = F.items.find(i => i.k === k);
    S.cur = { k, re: st[0] === "R" ? 1 : 0, opts: shuffle(it.choices, rnd), wopts: it.wc.length >= 2 ? shuffle(it.wc, rnd) : [], w: null, a: null,
              nf: !!(F.ui && F.ui.fuda) && !!it.jodan, f: false };   // nf＝札が要る（set の ui.fuda。おぼえる語は札なし）。f＝札を押した（押すまで選択肢を出さない）
  }
  return S.cur;
}
// 押した（札→いつ→答えの順。札が要る set では札を押すまで いつ・答え は押せない）
function openFuda(S) { const e = S.cur; if (!e || !e.nf || e.f) return false; e.f = true; return true; }
function pickWhen(S, v) { const e = S.cur; if (!e || e.w != null || !e.wopts.length || (e.nf && !e.f)) return false; e.w = v; return true; }
function pickAns(S, v) { const e = S.cur; if (!e || e.a != null || (e.nf && !e.f) || (e.wopts.length && e.w == null)) return false; e.a = v; return true; }
// 次へ: T・D・R は進むだけ（H＝段なしの見出しは区切りの印で、画面は出さず飛ばす）。Q は済に数え、×ならそのブロックの末尾（次の T・D の前）に R を差し込む
function advance(S, F) {
  const st = step(S);
  if (st === "END") return st;
  const skipH = () => { while (S.pos < S.steps.length && S.steps[S.pos][0] === "H") S.pos++; return step(S); };
  if (st[0] === "T" || st[0] === "D" || st[0] === "H") { S.pos++; return skipH(); }
  const at = i => { while (i < S.steps.length && !/^[TDH]\|/.test(S.steps[i])) i++; return i; };
  const e = S.cur, it = F.items.find(i => i.k === st.slice(2));
  if (!e || e.a == null) return st;
  if (st[0] === "Q") {
    if (!S.done.includes(it.k)) S.done.push(it.k);
    if (e.a !== it.a && !S.wrong.includes(it.k)) { S.wrong.push(it.k); S.steps.splice(at(S.pos + 1), 0, "R|" + it.k); }
  }
  S.pos++;
  S.cur = null;
  return skipH();
}
// 何問目（Q の列の中の番号。R はいま済んでいる数）
function qNum(S) { return S.steps.slice(0, S.pos + 1).filter(x => x[0] === "Q").length; }
function total(S) { return S.steps.filter(x => x[0] === "Q").length; }
// いまの論点（上段ブロック）の中の位置。at の画面（既定は いま）から、前の D と次の T・D の間を見る
// → { n: 問の数, i: いまの問の位置（0〜）, rn: 再出の数, ri: いまの再出の位置（0〜。R のときだけ） }
function blockPos(S, at = S.pos) {
  let a = at; while (a > 0 && !/^[DH]\|/.test(S.steps[a])) a--;
  let b = a + 1; while (b < S.steps.length && !/^[TDH]\|/.test(S.steps[b])) b++;
  const seg = S.steps.slice(a + 1, b), off = at - a - 1;
  return { n: seg.filter(x => x[0] === "Q").length, i: seg.slice(0, off).filter(x => x[0] === "Q").length,
           rn: seg.filter(x => x[0] === "R").length, ri: seg.slice(0, off).filter(x => x[0] === "R").length };
}
if (typeof module !== "undefined") module.exports = { shuffle, buildSteps, newState, syncState, step, curEntry, openFuda, pickWhen, pickAns, advance, qNum, total, blockPos };
// CORE-END
</script>
<script>
const F = (typeof FLOW !== "undefined" && FLOW) || { items: [], blocks: [], J: {}, T: {} };
if (F.title) document.title = F.title;
const J = F.J, BY = Object.fromEntries(F.items.map(i => [i.k, i]));
const params = new URLSearchParams(location.search);
const DEPLOY = params.get("d") || "";
const API = DEPLOY ? `https://script.google.com/macros/s/${encodeURIComponent(DEPLOY)}/exec` : "";
const TRY = params.get("try") === "1";
const SUF = SET ? "." + SET : "";   // 進みは set ごとに分ける（5B10 は従来のキーのまま）
const SKEY = (TRY ? "nitaku.flow.try4" : "nitaku.flow.v4") + SUF, QKEY = TRY ? "nitaku.flowq.try" : "nitaku.flowq.v1", DKEY = "nendai.dev";
const MODE = TRY ? "nitaku_flow_try" : "nitaku_flow";
const $app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
let DEV = TRY ? "テスト-パパ" : ls.get(DKEY, "");
if (!DEV) { DEV = "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); ls.set(DKEY, DEV); }
function ts() {
  const d = new Date(), p = n => String(n).padStart(2, "0"), o = -d.getTimezoneOffset();
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}${o >= 0 ? "+" : "-"}${p(Math.floor(Math.abs(o) / 60))}:${p(Math.abs(o) % 60)}`;
}
let flushing = false;
function log(args) {
  if (!API) return;
  const q = ls.get(QKEY, []); q.push(Object.assign({ dev: DEV, ts: ts(), mode: MODE }, args)); ls.set(QKEY, q); flush();
}
async function flush() {
  if (!API || flushing) return;
  flushing = true;
  try {
    for (;;) {
      const q = ls.get(QKEY, []); if (!q.length) break;
      const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, credentials: "omit",
                                   body: JSON.stringify({ app: "nendai", op: "log", args: q[0] }) });
      if (!r.ok) break;
      const q2 = ls.get(QKEY, []); q2.shift(); ls.set(QKEY, q2);
    }
  } catch (e) { /* 次の機会に */ }
  flushing = false;
}
window.addEventListener("online", flush);
document.addEventListener("visibilitychange", () => { if (!document.hidden) flush(); });

let S = ls.get(SKEY, null);
if (!S || S.v !== 4) S = newState(F); else syncState(S, F);
const save = () => ls.set(SKEY, S);
let menuOpen = 0, t0 = Date.now(), onTop = true;

function bar(tag, step, mid = "") {
  return `<div class="bar">${tag ? `<span class="tag ${esc(tag)}">${esc(tag)}</span>` : ""}<span class="step">${step || ""}</span><span class="sp"></span>${mid}<span class="sp"></span><button class="menu" id="mb">…</button></div>` +
    (menuOpen ? `<div class="mn">${menuOpen === 1 ? `<button id="m1">最初から</button>` : `<button class="danger" id="m2">ほんとうに最初から</button>`}<button id="m0">やめる</button></div>` : "");
}
function bindMenu() {
  const on = (id, f) => { const el = document.getElementById(id); if (el) el.onclick = f; };
  on("mb", () => { menuOpen = menuOpen ? 0 : 1; render(); });
  on("m0", () => { menuOpen = 0; render(); });
  on("m1", () => { menuOpen = 2; render(); });
  on("m2", () => { menuOpen = 0; S = newState(F); onTop = true; save(); render(); });
}
const UI = F.ui || {};
if (UI.bottom) $app.classList.add("bt");
// 画面の組み: ui.bottom なら 上の欄（pane）と下の固定欄（dock）。無ければ今までどおり縦に並べる（5B10）
const lay = (head, body, dock) => UI.bottom ? `${head}<div class="pane" id="pane">${body}</div><div class="dock">${dock}</div>` : head + body + dock;
const nextBtn = (label, cls = "push", id = "nx") => `<button class="next ${cls}" id="${id}">${esc(label)}</button>`;
function bindNext(f, id = "nx") { const el = document.getElementById(id); if (el) el.onclick = f; }
const go = () => { advance(S, F); t0 = Date.now(); render(); scrollTo(0, 0); };

function render() {
  save();
  if (onTop) return drawTop();
  const st = step(S);
  if (st === "END") return drawEnd();
  if (st[0] === "T") return drawSaijo(st.slice(2));
  if (st[0] === "D") return drawDan(st.slice(2));
  drawItem();
}

// トップ: 題・全体の進み n／47・ボタン1つ
function drawTop() {
  const n = S.done.length, N = total(S), end = step(S) === "END";
  const fresh = S.pos === 0 && !S.cur;
  $app.innerHTML = lay(bar("", ""), `<div class="top"><h1>${esc(F.title || "見方→問題 5B10")}</h1><div class="big">${n}<small class="lead">／${N}</small></div>` +
    (end ? `<p class="lead">ぜんぶ終わった</p>` : "") + `</div>`,
    (end ? "" : nextBtn(fresh ? "はじめる" : "つづきから")));
  bindMenu();
  bindNext(() => { onTop = false; t0 = Date.now(); render(); });
}

// 最上段: その教科が初めて出る直前に1回。読むだけ
function drawSaijo(s) {
  const ts_ = (F.T && F.T[s]) || [];
  $app.innerHTML = lay(bar(s, ""), `<div class="saijo"><div class="lbl">${esc(s)}でいつも聞くこと</div>` +
    ts_.map(t => `<div class="say">${esc(t.say)}</div>`).join("") + `</div>`, nextBtn("次へ"));
  bindMenu(); bindNext(go);
}

// 段: 言い方（大きく1行）・もし→なら（2行）・もしもの1行（読むだけ）
function drawDan(jid) {
  const j = J[jid];
  $app.innerHTML = lay(bar(j.s, ""), `<div class="dan"><div class="say">${esc(j.say)}</div>` +
    `<div class="lbl">もし</div><div class="txt">${esc(j.moshi)}</div><div class="lbl">なら</div><div class="txt">${esc(j.nara)}</div>` +
    (j.iff ? `<div class="iff">${esc(j.iff)}</div>` : "") + `<div class="cnt">この論点は ${blockPos(S, S.pos + 1).n}問</div></div>`, nextBtn("問題へ"));
  if (j.kk) $app.querySelector(".dan .say").insertAdjacentHTML("afterend", `<div class="kkline">${esc(fudaText(j))}</div>`);
  bindMenu(); bindNext(go);
}

// 問: 出題と返りを1画面で。いつ（社会）→答え を押すと、その場で印と ○×・正解・上段の「なら」1行・「次へ」（見方は上に出ているので返りでは繰り返さない）
function drawItem() {
  if (UI.bottom) return drawItemB();
  const e = curEntry(S, F), it = BY[e.k], j = J[it.jodan] || {};
  // 全体 n／47 と、論点の中の位置（page.html と同じ点。済んだ●・いま◎・まだ○。再出は「もう一度 1／2」）
  const stp = `${qNum(S)}／${total(S)}`, bp = blockPos(S);
  const mid = e.re ? `<span class="dots re">もう一度 ${bp.ri + 1}／${bp.rn}</span>`
    : `<span class="dots">${Array.from({ length: bp.n }, (_, i) => i < bp.i || (i === bp.i && e.a != null) ? "●" : i === bp.i ? "◎" : "○").join("")}</span>`;
  const answered = e.a != null, needW = e.wopts.length > 0;
  const cls = (v, mine, right) => !answered ? "" : (v === right ? " right" : v === mine ? " wrong" : "") + (v === mine ? " mine" : "");
  const btn = (v, i, kind, mine, right, wait) =>
    `<button class="c${cls(v, mine, right)}${wait ? " wait" : ""}" data-k="${kind}" data-v="${i}"${answered || wait ? " disabled" : ""}>${esc(v)}</button>`;
  let h = bar(it.s, stp, mid) + (j.say ? `<div class="head">見方: ${esc(j.say)}</div>` : !it.jodan ? `<div class="head">おぼえる語</div>` : "") +
    `<div class="q">${esc(it.q)}</div>` + (it.fig ? `<img class="fig" src="${esc(it.fig)}" alt="図">` : "");
  if (needW) {
    const wDone = e.w != null;
    h += `<div class="ask">いつの話？</div><div class="wr">` + e.wopts.map((v, i) =>
      `<button class="c${wDone ? (v === it.when ? " right" : v === e.w ? " wrong" : "") + (v === e.w ? " mine" : "") : ""}" data-k="w" data-v="${i}"${wDone ? " disabled" : ""}>${esc(v)}</button>`).join("") + `</div>`;
  }
  h += `<div class="ask">答えは？</div><div class="ch">` + e.opts.map((v, i) => btn(v, i, "a", e.a, it.a, needW && e.w == null)).join("") + `</div>`;
  if (answered) {
    const okA = e.a === it.a;
    h += `<div class="res" id="res"><div class="row"><b class="${okA ? "ok" : "ng"}">${okA ? "○" : "×"}</b><span>${okA ? "" : `正解は「${esc(it.a)}」`}</span></div>` +
      (needW && e.w !== it.when ? `<div class="fb">いつ: ${esc(it.when)}</div>` : "") +
      (it.hint ? `<div class="fb">${esc(it.hint)}</div>` : j.nara ? `<div class="fb">なら ${esc(j.nara)}</div>` : "") +
      `</div>` + nextBtn("次へ", "");
  }
  $app.innerHTML = h;
  bindMenu();
  $app.querySelectorAll(".c[data-k]").forEach(el => el.onclick = () => {
    const v = (el.dataset.k === "w" ? e.wopts : e.opts)[+el.dataset.v];
    if (el.dataset.k === "w") {
      if (!pickWhen(S, v)) return;
      log({ stage: it.s, bundle: `いつ|${it.n}`, year: String(e.re + 1), event: String(it.q).slice(0, 300), aEra: v, aYear: it.when, ok: v === it.when ? 1 : 0, sec: "" });
      t0 = Date.now(); render(); return;
    }
    if (!pickAns(S, v)) return;
    const sec = Math.round((Date.now() - t0) / 100) / 10;
    log({ stage: it.s, bundle: `${it.m || F.tag}|${it.n}`, year: String(e.re + 1), event: String(it.q).slice(0, 300), aEra: v, aYear: it.a, ok: v === it.a ? 1 : 0, sec });
    render();
    const nx = document.getElementById("nx");
    if (nx && nx.getBoundingClientRect().bottom > innerHeight) nx.scrollIntoView({ block: "end", behavior: "smooth" });
  });
  bindNext(go);
}
// 札の文: 「もし ◯◯ → 考え方、で考える」（考え方が無ければ 言い方 →）
const fudaText = j => j.kk ? `もし ${j.fm || j.say} → ${j.kk}、で考える` : `${j.say || ""} →`;
// 問（ui.bottom）: 上の欄に問題文・図、下の固定欄に 札 →（押すと）選択肢 →（押すと）○×・正解・一言・「次へ」
function drawItemB() {
  const e = curEntry(S, F), it = BY[e.k], j = J[it.jodan] || {};
  const stp = `${qNum(S)}／${total(S)}`, bp = blockPos(S);
  const mid = e.re ? `<span class="dots re">もう一度 ${bp.ri + 1}／${bp.rn}</span>`
    : `<span class="dots">${Array.from({ length: bp.n }, (_, i) => i < bp.i || (i === bp.i && e.a != null) ? "●" : i === bp.i ? "◎" : "○").join("")}</span>`;
  const fudaSay = it.jodan ? fudaText(j) : "";
  // 上の欄: 問題文（と図）を縦の真ん中に。おぼえる語は見出しを添える
  const body = `<div class="mid">` + (!it.jodan ? `<div class="head">${esc(F.oboe || "おぼえる語")}</div>` : !e.nf && j.say ? `<div class="head">見方: ${esc(j.say)}</div>` : "") +
    `<div class="q">${esc(it.q)}</div>` + (it.fig ? `<img class="fig" src="${esc(it.fig)}" alt="図">` : "") + `</div>`;
  // 下の固定欄: 札（上。押すと印に変わり残る）＋選択肢（下。札を押すまで薄く押せない）→ 答えたら 札＋○×・返し・「次へ」
  const fudaBtn = !e.nf ? "" : !e.f ? `<button class="fuda" id="fuda"><span class="fm">${esc(j.kk ? `もし ${j.fm || j.say} →` : fudaSay)}</span>${j.kk ? `<span class="kk">${esc(j.kk)}、で考える</span>` : ""}</button>`
    : `<button class="fuda on" disabled><span class="fm">${esc(j.kk ? `もし ${j.fm || j.say} →` : fudaSay)}</span>${j.kk ? `<span class="kk">${esc(j.kk)}、で考える</span>` : ""}</button>`;
  const lock = e.nf && !e.f;
  let dock;
  if (e.a == null) {
    dock = fudaBtn + (e.wopts.length ? `<div class="ask">いつの話？</div><div class="wr">` + e.wopts.map((v, i) =>
      `<button class="c${e.w != null ? (v === it.when ? " right" : v === e.w ? " wrong mine" : "") : ""}" data-k="w" data-v="${i}"${e.w != null ? " disabled" : ""}>${esc(v)}</button>`).join("") + `</div><div class="ask">答えは？</div>` : "") +
      `<div class="ch">` + e.opts.map((v, i) => { const wt = lock || (e.wopts.length && e.w == null); return `<button class="c${wt ? " wait" : ""}" data-k="a" data-v="${i}"${wt ? " disabled" : ""}>${esc(v)}</button>`; }).join("") + `</div>`;
  } else {
    const okA = e.a === it.a;
    dock = fudaBtn + `<div class="res" id="res"><div class="row"><b class="${okA ? "ok" : "ng"}">${okA ? "○" : "×"}</b><span>${okA ? esc(it.a) : `正解は「${esc(it.a)}」<small class="lead">（えらんだ ${esc(e.a)}）</small>`}</span></div>` +
      (e.wopts.length && e.w !== it.when ? `<div class="fb">いつ: ${esc(it.when)}</div>` : "") +
      (it.hint ? `<div class="fb">${esc(it.hint)}</div>` : j.nara ? `<div class="fb">なら ${esc(j.nara)}</div>` : "") +
      `</div>` + nextBtn("次へ", "");
  }
  $app.innerHTML = lay(bar(it.s, stp, mid), body, dock);
  document.getElementById("pane").classList.add("ctr");
  bindMenu();
  const fb = document.getElementById("fuda");
  if (fb) fb.onclick = () => {
    if (!openFuda(S)) return;
    const sec = Math.round((Date.now() - t0) / 100) / 10;   // 札を押すまでの秒（頭で答える時間）
    log({ stage: it.s, bundle: `札|${it.m || F.tag}|${it.n}`, year: String(e.re + 1), event: String(it.q).slice(0, 300), aEra: fudaSay, aYear: "", ok: "", sec });
    t0 = Date.now(); render();
  };
  $app.querySelectorAll(".c[data-k]").forEach(el => el.onclick = () => {
    const v = (el.dataset.k === "w" ? e.wopts : e.opts)[+el.dataset.v];
    if (el.dataset.k === "w") {
      if (!pickWhen(S, v)) return;
      log({ stage: it.s, bundle: `いつ|${it.n}`, year: String(e.re + 1), event: String(it.q).slice(0, 300), aEra: v, aYear: it.when, ok: v === it.when ? 1 : 0, sec: "" });
      t0 = Date.now(); render(); return;
    }
    if (!pickAns(S, v)) return;
    const sec = Math.round((Date.now() - t0) / 100) / 10;   // 札（無ければ画面）から答えまで
    log({ stage: it.s, bundle: `${it.m || F.tag}|${it.n}`, year: String(e.re + 1), event: String(it.q).slice(0, 300), aEra: v, aYear: it.a, ok: v === it.a ? 1 : 0, sec });
    render();
  });
  bindNext(go);
}
function drawEnd() {
  $app.innerHTML = lay(bar("", ""), `<div class="end">おわり<br><span class="lead">${S.done.length} 問やった</span></div>`, "");
  bindMenu();
}
if (TRY) {
  document.body.insertAdjacentHTML("afterbegin", '<div style="position:fixed;top:0;left:0;right:0;z-index:55;background:var(--selbg);color:var(--sel);border-bottom:1px solid var(--line);font-size:13px;text-align:center;padding:1px 8px">試し（娘の記録に混ざらない）</div>');
  document.body.style.paddingTop = "22px"; document.documentElement.style.setProperty("--top", "22px");
}
if (!API) { const t = document.createElement("div"); t.id = "norec"; t.textContent = "きろくなし"; document.body.appendChild(t); }
if (!F.items.length) $app.innerHTML = `<p class="lead">データがありません</p>`; else render();
flush();
</script>
</body>
